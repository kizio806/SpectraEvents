[versions]
archunit = "1.5.0"
checkstyle = "14.1.0"
googlejavaformat = "1.36.1"
jacoco = "0.8.15"
junit = "5.14.4"
ktlint = "1.8.0"
pmd = "7.27.0"
errorprone = "2.49.0"
errorprone-gradle-plugin = "5.1.0"
spotbugs-gradle-plugin = "6.5.11"
paper = "26.1.1.build.29-alpha"
run-paper = "3.1.0"
shadow = "9.6.1"
spotless = "8.10.2"
