# =============================================================================
# SpectraEvents — Model Definition: Airdrop Crate
# =============================================================================
# The Supply Airdrop crate descends from the sky attached to a parachute.
# This model uses a hierarchical assembly: a wooden crate body with metal
# straps, a canvas parachute dome, and four suspension lines.
#
# EVENT INTEGRATION
#   Referenced by: events/airdrop.yml
#   Animations used by the event:
#     descent  — plays during the "falling" phase (3 s, ONCE)
#     land     — plays on landing (parachute collapses, crate bounces)
#     open     — plays when the crate unlocks (lid lifts open)
# =============================================================================

id: airdrop_crate

parts:

  # --- Crate body ---
  # The main wooden box. All other crate parts are children of this node.
  body:
    type: item_display
    item: minecraft:barrel          # Barrel has a believable wooden-crate look
    transform:
      translation: [0.0, 0.0, 0.0]
      rotation:
        euler: [0.0, 45.0, 0.0]   # Rotate 45° so the barrel face looks "forward"
      scale: [1.5, 1.5, 1.5]
    render:
      billboard: fixed
      shadowRadius: 1.2
      shadowStrength: 0.8
      viewRange: 80.0

  # --- Crate lid ---
  # A thin slab of oak planks sitting on top of the barrel to simulate a
  # removable lid. Pivots open in the "open" animation.
  lid:
    type: block_display
    parent: body
    block: minecraft:oak_planks
    transform:
      translation: [0.0, 0.82, 0.0]      # Sits right on top of the barrel
      scale: [1.05, 0.12, 1.05]          # Wide and thin — lid shape
    render:
      billboard: fixed

  # --- Horizontal strap ---
  # A dark spruce strip running left–right across the crate face. Adds
  # the visual impression of reinforcing bands.
  strap_h:
    type: block_display
    parent: body
    block: minecraft:spruce_planks
    transform:
      translation: [0.0, 0.0, 0.52]      # Slightly in front of the barrel face
      scale: [1.52, 0.09, 0.06]
    render:
      billboard: fixed

  # --- Vertical strap ---
  # Matching spruce strip running up–down on the same face.
  strap_v:
    type: block_display
    parent: body
    block: minecraft:spruce_planks
    transform:
      translation: [0.0, 0.0, 0.54]
      scale: [0.09, 1.52, 0.06]
    render:
      billboard: fixed

  # --- Parachute dome ---
  # A wide flat white-wool disc above the crate simulates the inflated
  # parachute canopy. Billboarded and scaled flat on the Y axis.
  parachute:
    type: block_display
    parent: body
    block: minecraft:white_wool
    transform:
      translation: [0.0, 3.2, 0.0]
      scale: [3.2, 0.25, 3.2]            # Very wide, very flat dome
    render:
      billboard: fixed
      viewRange: 96.0

  # --- Parachute inner highlight ---
  # Light blue tint in the centre of the canopy for visual depth.
  parachute_inner:
    type: block_display
    parent: body
    block: minecraft:light_blue_wool
    transform:
      translation: [0.0, 3.25, 0.0]
      scale: [1.6, 0.18, 1.6]
    render:
      billboard: fixed
      viewRange: 80.0

  # --- Suspension lines (4 corners) ---
  # Thin quartz-pillar strips representing the ropes between chute and crate.
  # Positioned at the four diagonal corners.
  line_nw:
    type: block_display
    parent: body
    block: minecraft:quartz_pillar
    transform:
      translation: [-0.7, 2.1, -0.7]
      rotation:
        euler: [35.0, 45.0, 0.0]         # Angled inward toward the chute centre
      scale: [0.07, 1.6, 0.07]
    render:
      billboard: fixed

  line_ne:
    type: block_display
    parent: body
    block: minecraft:quartz_pillar
    transform:
      translation: [0.7, 2.1, -0.7]
      rotation:
        euler: [35.0, -45.0, 0.0]
      scale: [0.07, 1.6, 0.07]
    render:
      billboard: fixed

  line_sw:
    type: block_display
    parent: body
    block: minecraft:quartz_pillar
    transform:
      translation: [-0.7, 2.1, 0.7]
      rotation:
        euler: [-35.0, 45.0, 0.0]
      scale: [0.07, 1.6, 0.07]
    render:
      billboard: fixed

  line_se:
    type: block_display
    parent: body
    block: minecraft:quartz_pillar
    transform:
      translation: [0.7, 2.1, 0.7]
      rotation:
        euler: [-35.0, -45.0, 0.0]
      scale: [0.07, 1.6, 0.07]
    render:
      billboard: fixed

  # --- Event label ---
  # Floating text above the parachute. Players can see this from a distance.
  label:
    type: text_display
    parent: body
    text: "<gold><bold>📦 AIRDROP</bold></gold>"
    textAlignment: center
    transform:
      translation: [0.0, 4.5, 0.0]
    render:
      billboard: center
      viewRange: 96.0

# ---------------------------------------------------------------------------
# INTERACTIONS
# ---------------------------------------------------------------------------
interactions:
  # Click anywhere on the crate body area to attempt a claim
  main:
    parent: body
    width: 2.0          # 2 blocks wide
    height: 2.0         # 2 blocks tall

# ---------------------------------------------------------------------------
# ANIMATIONS
# ---------------------------------------------------------------------------
animations:

  # ----- descent -----
  # The entire assembly drifts downward while the parachute gently oscillates.
  # Simulates free-fall with realistic sway. Plays during the "falling" phase.
  descent:
    duration: 3s
    loop: ONCE
    recovery: RESTART
    tracks:
      body:
        translation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
            easing: ease_in         # Starts slow, accelerates — falling feel
          - at: 3s
            value: [0.0, -2.0, 0.0]
      # Parachute gently rocks side to side during descent
      parachute:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 750ms
            value: [0.0, 0.0, 5.0]
            easing: ease_in_out
          - at: 1500ms
            value: [0.0, 0.0, -5.0]
            easing: ease_in_out
          - at: 2250ms
            value: [0.0, 0.0, 5.0]
            easing: ease_in_out
          - at: 3s
            value: [0.0, 0.0, 0.0]

  # ----- land -----
  # Impact: the parachute collapses (Y scale → 0) and the crate bounces once.
  # Plays in the "locked" phase on-enter, immediately after descent completes.
  land:
    duration: 600ms
    loop: ONCE
    recovery: STOP
    tracks:
      # Crate squashes on impact, bounces back to normal
      body:
        scale:
          - at: 0s
            value: [1.5, 1.5, 1.5]
          - at: 150ms
            value: [1.8, 1.1, 1.8]     # Squash on impact
            easing: ease_out
          - at: 350ms
            value: [1.3, 1.6, 1.3]     # Stretch bounce
            easing: ease_in_out
          - at: 600ms
            value: [1.5, 1.5, 1.5]     # Settle
      # Parachute fabric collapses flat
      parachute:
        scale:
          - at: 0s
            value: [3.2, 0.25, 3.2]
          - at: 300ms
            value: [2.0, 0.05, 2.0]
            easing: ease_in
          - at: 600ms
            value: [0.1, 0.02, 0.1]
      parachute_inner:
        scale:
          - at: 0s
            value: [1.6, 0.18, 1.6]
          - at: 600ms
            value: [0.1, 0.02, 0.1]

  # ----- open -----
  # The lid pivots open to reveal the contents. Plays in the "open" phase.
  # The lid is hinged at the back (negative-Z edge), so it rotates on X.
  open:
    duration: 800ms
    loop: ONCE
    recovery: STOP
    tracks:
      lid:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
            easing: ease_out
          - at: 600ms
            value: [-110.0, 0.0, 0.0]  # Lid flings open past vertical
          - at: 800ms
            value: [-100.0, 0.0, 0.0]  # Settles slightly back — realistic hinge
        # Lid also rises slightly as it swings open (pivot compensation)
        translation:
          - at: 0s
            value: [0.0, 0.82, 0.0]
          - at: 800ms
            value: [0.0, 0.82, -0.5]
