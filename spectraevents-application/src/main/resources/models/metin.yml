id: dev_metin_model

parts:
  stone:
    type: item_display
    item: minecraft:crying_obsidian
    transform:
      translation: [0.0, 0.0, 0.0]
      scale: [2.5, 2.5, 2.5]
    render:
      billboard: fixed

  label:
    type: text_display
    parent: stone
    text: "<purple><bold>🪨 METIN STONE"
    transform:
      translation: [0.0, 3.0, 0.0]
    render:
      billboard: center

interactions:
  main:
    parent: stone
    width: 3.0
    height: 3.5

animations:
  pulse:
    duration: 1s
    loop: LOOP
    recovery: RESUME
    tracks:
      stone:
        scale:
          - at: 0s
            value: [1.0, 1.0, 1.0]
          - at: 1s
            value: [1.05, 1.05, 1.05]
