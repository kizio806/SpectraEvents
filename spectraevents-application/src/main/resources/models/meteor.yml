id: dev_meteor_model

parts:
  core:
    type: item_display
    item: minecraft:magma_block
    transform:
      translation: [0.0, 0.0, 0.0]
      scale: [2.0, 2.0, 2.0]
    render:
      billboard: fixed

  label:
    type: text_display
    parent: core
    text: "<red><bold>☄ METEOR"
    transform:
      translation: [0.0, 2.5, 0.0]
    render:
      billboard: center

interactions:
  main:
    parent: core
    width: 3.0
    height: 3.0

animations:
  fall:
    duration: 3s
    loop: ONCE
    recovery: RESTART
    tracks:
      core:
        translation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 3s
            value: [0.0, -3.0, 0.0]
