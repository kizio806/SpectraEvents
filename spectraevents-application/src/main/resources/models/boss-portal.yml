# =============================================================================
# SpectraEvents — Model Definition: Boss Portal
# =============================================================================
# A dimensional gateway built from four stone pillars, a purpur arch frame,
# a shimmering end-portal plane, eye blocks on each pillar, and two
# transparent particle-ring halos that rotate in opposite directions.
#
# The portal looks like a free-standing Nether/End dimensional rift — no
# resource pack is required; vanilla block and item textures are used.
#
# EVENT INTEGRATION
#   Referenced by: events/boss-portal.yml
#   Animations used:
#     opening  — pillars rise and arch assembles itself (ONCE, 2 s)
#     active   — gate rotates, rings orbit in opposite directions (LOOP)
#     close    — everything implodes inward (ONCE, 1 s)
#
# COORDINATE SYSTEM
#   +X = East,  -X = West
#   +Z = South, -Z = North
#   +Y = Up
#   All offsets below are relative to the model spawn point.
# =============================================================================

id: boss_portal

parts:

  # =========================================================================
  # PILLARS — four end_stone_brick columns at ±1.8 on X and Z
  # =========================================================================

  # --- North pillar ---
  pillar_n:
    type: block_display
    block: minecraft:end_stone_bricks
    transform:
      translation: [0.0, 0.0, -1.8]
      scale: [0.55, 2.8, 0.55]         # Tall narrow column
    render:
      billboard: fixed
      shadowRadius: 0.4
      shadowStrength: 0.7
      viewRange: 80.0

  # --- South pillar ---
  pillar_s:
    type: block_display
    block: minecraft:end_stone_bricks
    transform:
      translation: [0.0, 0.0, 1.8]
      scale: [0.55, 2.8, 0.55]
    render:
      billboard: fixed
      shadowRadius: 0.4
      shadowStrength: 0.7
      viewRange: 80.0

  # --- East pillar (left side when facing north) ---
  pillar_e:
    type: block_display
    block: minecraft:end_stone_bricks
    transform:
      translation: [1.8, 0.0, 0.0]
      scale: [0.55, 2.8, 0.55]
    render:
      billboard: fixed
      shadowRadius: 0.4
      shadowStrength: 0.7
      viewRange: 80.0

  # --- West pillar (right side when facing north) ---
  pillar_w:
    type: block_display
    block: minecraft:end_stone_bricks
    transform:
      translation: [-1.8, 0.0, 0.0]
      scale: [0.55, 2.8, 0.55]
    render:
      billboard: fixed
      shadowRadius: 0.4
      shadowStrength: 0.7
      viewRange: 80.0

  # =========================================================================
  # ARCH FRAME — purpur blocks connecting the pillars at the top
  # =========================================================================

  # --- Top horizontal beam (runs N → S) ---
  arch_top:
    type: block_display
    block: minecraft:purpur_block
    transform:
      translation: [0.0, 2.7, 0.0]
      scale: [0.55, 0.45, 4.1]         # Bridges north to south pillar tops
    render:
      billboard: fixed
      brightnessBlock: 10
      viewRange: 80.0

  # --- East arch side (runs bottom to top along +X) ---
  arch_e:
    type: block_display
    block: minecraft:purpur_pillar
    transform:
      translation: [1.8, 1.3, 0.0]
      scale: [0.45, 2.8, 0.45]
    render:
      billboard: fixed
      brightnessBlock: 10
      viewRange: 80.0

  # --- West arch side ---
  arch_w:
    type: block_display
    block: minecraft:purpur_pillar
    transform:
      translation: [-1.8, 1.3, 0.0]
      scale: [0.45, 2.8, 0.45]
    render:
      billboard: fixed
      brightnessBlock: 10
      viewRange: 80.0

  # =========================================================================
  # PORTAL GATE PLANE
  # A thin slab of blackstone placed flat inside the arch opening to simulate
  # the dark abyss of a portal. Rotated on Y so it faces along the arch axis.
  # =========================================================================
  gate:
    type: block_display
    block: minecraft:blackstone
    transform:
      translation: [0.0, 1.3, 0.0]
      rotation:
        euler: [0.0, 90.0, 0.0]        # Face east-west (same plane as pillars)
      scale: [0.08, 2.6, 3.6]          # Very thin, fills the arch interior
    render:
      billboard: fixed
      brightnessBlock: 0                    # Pitch black — no ambient light
      viewRange: 80.0

  # =========================================================================
  # END PORTAL FRAME EYES — one atop each pillar
  # These give the classic "eye of the portal" detail and glow purple at night.
  # =========================================================================

  eye_n:
    type: item_display
    parent: pillar_n
    item: minecraft:end_portal_frame
    transform:
      translation: [0.0, 1.6, 0.0]     # Sit on top of the pillar
      scale: [0.4, 0.4, 0.4]
    render:
      billboard: fixed
      brightnessBlock: 15

  eye_s:
    type: item_display
    parent: pillar_s
    item: minecraft:end_portal_frame
    transform:
      translation: [0.0, 1.6, 0.0]
      scale: [0.4, 0.4, 0.4]
    render:
      billboard: fixed
      brightnessBlock: 15

  eye_e:
    type: item_display
    parent: pillar_e
    item: minecraft:end_portal_frame
    transform:
      translation: [0.0, 1.6, 0.0]
      scale: [0.4, 0.4, 0.4]
    render:
      billboard: fixed
      brightnessBlock: 15

  eye_w:
    type: item_display
    parent: pillar_w
    item: minecraft:end_portal_frame
    transform:
      translation: [0.0, 1.6, 0.0]
      scale: [0.4, 0.4, 0.4]
    render:
      billboard: fixed
      brightnessBlock: 15

  # =========================================================================
  # PARTICLE HALO RINGS
  # Two flat, wide, very thin magenta stained-glass discs that orbit the
  # portal at different heights. They rotate in opposite directions in the
  # "active" animation to create a magical orbiting-ring effect.
  # =========================================================================

  ring_inner:
    type: block_display
    block: minecraft:magenta_stained_glass   # Semi-transparent purple
    transform:
      translation: [0.0, 1.0, 0.0]
      scale: [2.4, 0.04, 2.4]               # Wide and paper-thin
    render:
      billboard: fixed
      brightnessBlock: 12
      viewRange: 96.0

  ring_outer:
    type: block_display
    block: minecraft:purple_stained_glass
    transform:
      translation: [0.0, 1.8, 0.0]
      scale: [3.0, 0.04, 3.0]
    render:
      billboard: fixed
      brightnessBlock: 12
      viewRange: 96.0

  # --- Event label ---
  label:
    type: text_display
    text: "<dark_purple><bold>BOSS PORTAL</bold></dark_purple>"
    textAlignment: center
    transform:
      translation: [0.0, 4.0, 0.0]
    render:
      billboard: center
      viewRange: 96.0

# ---------------------------------------------------------------------------
# INTERACTIONS
# ---------------------------------------------------------------------------
interactions:
  # Wide hitbox centred on the gate plane — the portal "entrance"
  main:
    parent: gate
    width: 4.0
    height: 3.0

# ---------------------------------------------------------------------------
# ANIMATIONS
# ---------------------------------------------------------------------------
animations:

  # ----- opening -----
  # The portal assembles itself dramatically:
  #   - Pillars rise from underground (Y -2.8 → 0)
  #   - Arch descends from above (Y +4 → +2.7 for top, +1.3 for sides)
  #   - Gate fades in (scale 0 → full)
  #   - Rings appear and begin rotating
  opening:
    duration: 2s
    loop: ONCE
    recovery: RESTART
    tracks:
      # Pillars rise from the earth
      pillar_n:
        translation:
          - at: 0s
            value: [0.0, -2.8, -1.8]
            easing: ease_out
          - at: 1400ms
            value: [0.0, 0.0, -1.8]
      pillar_s:
        translation:
          - at: 0s
            value: [0.0, -2.8, 1.8]
            easing: ease_out
          - at: 1400ms
            value: [0.0, 0.0, 1.8]
      pillar_e:
        translation:
          - at: 0s
            value: [1.8, -2.8, 0.0]
            easing: ease_out
          - at: 1400ms
            value: [1.8, 0.0, 0.0]
      pillar_w:
        translation:
          - at: 0s
            value: [-1.8, -2.8, 0.0]
            easing: ease_out
          - at: 1400ms
            value: [-1.8, 0.0, 0.0]
      # Arch drops down from above after pillars are in position
      arch_top:
        translation:
          - at: 0s
            value: [0.0, 6.0, 0.0]
          - at: 800ms
            value: [0.0, 6.0, 0.0]    # Hold while pillars rise
          - at: 1800ms
            value: [0.0, 2.7, 0.0]
            easing: ease_out
      arch_e:
        translation:
          - at: 0s
            value: [1.8, 4.0, 0.0]
          - at: 800ms
            value: [1.8, 4.0, 0.0]
          - at: 1800ms
            value: [1.8, 1.3, 0.0]
            easing: ease_out
      arch_w:
        translation:
          - at: 0s
            value: [-1.8, 4.0, 0.0]
          - at: 800ms
            value: [-1.8, 4.0, 0.0]
          - at: 1800ms
            value: [-1.8, 1.3, 0.0]
            easing: ease_out
      # Gate plane materialises last
      gate:
        scale:
          - at: 0s
            value: [0.01, 0.01, 0.01]
          - at: 1600ms
            value: [0.01, 0.01, 0.01]  # Invisible while arch assembles
          - at: 2s
            value: [0.08, 2.6, 3.6]
            easing: ease_out
      # Rings spin into existence
      ring_inner:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 2s
            value: [0.0, 180.0, 0.0]
      ring_outer:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 2s
            value: [0.0, -180.0, 0.0]

  # ----- active -----
  # Steady-state while the boss is alive. The gate pulses slightly and the
  # two halo rings rotate in opposite directions continuously.
  active:
    duration: 3s
    loop: LOOP
    recovery: RESUME
    tracks:
      # Inner ring: clockwise orbit (positive Y)
      ring_inner:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 3s
            value: [0.0, 360.0, 0.0]
      # Outer ring: counter-clockwise orbit (negative Y)
      ring_outer:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 3s
            value: [0.0, -360.0, 0.0]
      # Gate plane gently pulses (scale X = thickness) like energy fields do
      gate:
        scale:
          - at: 0s
            value: [0.08, 2.6, 3.6]
          - at: 1500ms
            value: [0.12, 2.6, 3.6]
            easing: ease_in_out
          - at: 3s
            value: [0.08, 2.6, 3.6]
            easing: ease_in_out

  # ----- close -----
  # Boss defeated: everything implodes toward the centre simultaneously.
  close:
    duration: 1200ms
    loop: ONCE
    recovery: STOP
    tracks:
      pillar_n:
        translation:
          - at: 0s
            value: [0.0, 0.0, -1.8]
          - at: 1200ms
            value: [0.0, 0.0, 0.0]
            easing: ease_in
        scale:
          - at: 0s
            value: [0.55, 2.8, 0.55]
          - at: 1200ms
            value: [0.05, 0.05, 0.05]
      pillar_s:
        translation:
          - at: 0s
            value: [0.0, 0.0, 1.8]
          - at: 1200ms
            value: [0.0, 0.0, 0.0]
            easing: ease_in
        scale:
          - at: 0s
            value: [0.55, 2.8, 0.55]
          - at: 1200ms
            value: [0.05, 0.05, 0.05]
      pillar_e:
        translation:
          - at: 0s
            value: [1.8, 0.0, 0.0]
          - at: 1200ms
            value: [0.0, 0.0, 0.0]
            easing: ease_in
        scale:
          - at: 0s
            value: [0.55, 2.8, 0.55]
          - at: 1200ms
            value: [0.05, 0.05, 0.05]
      pillar_w:
        translation:
          - at: 0s
            value: [-1.8, 0.0, 0.0]
          - at: 1200ms
            value: [0.0, 0.0, 0.0]
            easing: ease_in
        scale:
          - at: 0s
            value: [0.55, 2.8, 0.55]
          - at: 1200ms
            value: [0.05, 0.05, 0.05]
      arch_top:
        scale:
          - at: 0s
            value: [0.55, 0.45, 4.1]
          - at: 1200ms
            value: [0.05, 0.05, 0.05]
            easing: ease_in
      gate:
        scale:
          - at: 0s
            value: [0.08, 2.6, 3.6]
          - at: 400ms
            value: [0.25, 2.8, 3.8]   # Flare before collapse
            easing: ease_out
          - at: 1200ms
            value: [0.0, 0.0, 0.0]
            easing: ease_in
      ring_inner:
        scale:
          - at: 0s
            value: [2.4, 0.04, 2.4]
          - at: 1200ms
            value: [0.0, 0.0, 0.0]
            easing: ease_in
      ring_outer:
        scale:
          - at: 0s
            value: [3.0, 0.04, 3.0]
          - at: 1200ms
            value: [0.0, 0.0, 0.0]
            easing: ease_in
