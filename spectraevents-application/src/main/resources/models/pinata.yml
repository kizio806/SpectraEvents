# =============================================================================
# SpectraEvents — Model Definition: Piñata
# =============================================================================
# A colourful donkey-shaped piñata hanging from a rope. Built from wool
# and concrete parts to create a recognisable star-shaped silhouette with
# legs and a visible rope/hook assembly.
#
# EVENT INTEGRATION
#   Referenced by: events/pinata.yml
#   Animations used:
#     idle   — gentle side-to-side sway while waiting to be hit (LOOP)
#     hit    — quick squash-and-stretch on each successful hit (ONCE)
#     break  — dramatic explosion when hits_reached triggers (ONCE)
#
# STRUCTURE
#   hook → rope → body → top_dome
#                      → tail
#                      → leg_1..4  (coloured hanging tassels)
# =============================================================================

id: pinata

parts:

  # --- Hook ---
  # A small iron-bar block at the very top, representing the metal hook from
  # which the piñata is suspended. The entire model hangs from this point.
  hook:
    type: item_display
    item: minecraft:iron_bars
    transform:
      translation: [0.0, 2.9, 0.0]
      scale: [0.25, 0.35, 0.25]
    render:
      billboard: fixed
      brightnessBlock: 12
      viewRange: 64.0

  # --- Rope ---
  # A thin quartz pillar strip between the hook and the piñata body.
  rope:
    type: block_display
    parent: hook
    block: minecraft:quartz_pillar
    transform:
      translation: [0.0, -0.7, 0.0]
      scale: [0.06, 0.7, 0.06]
    render:
      billboard: fixed

  # --- Main body ---
  # The piñata blob — magenta wool, slightly taller than wide to suggest
  # a traditional donkey body shape. This is the primary animation target.
  body:
    type: item_display
    parent: hook
    item: minecraft:magenta_wool
    transform:
      translation: [0.0, -1.6, 0.0]
      scale: [1.6, 2.0, 1.4]
    render:
      billboard: fixed
      brightnessBlock: 15              # Full brightness — festival colours should pop
      shadowRadius: 0.8
      shadowStrength: 0.5
      viewRange: 80.0

  # --- Top dome ---
  # Pink wool hat/dome sitting on top of the body. Slightly wider for a
  # rounded "head" appearance.
  top_dome:
    type: item_display
    parent: body
    item: minecraft:pink_wool
    transform:
      translation: [0.0, 1.1, 0.0]
      scale: [0.88, 0.45, 0.88]
    render:
      billboard: fixed
      brightnessBlock: 15

  # --- Tail ---
  # A small white-wool puff at the back of the body.
  tail:
    type: item_display
    parent: body
    item: minecraft:white_wool
    transform:
      translation: [0.0, 0.0, -0.75]
      scale: [0.3, 0.3, 0.3]
    render:
      billboard: fixed
      brightnessBlock: 15

  # --- Hanging legs / tassels ---
  # Four coloured concrete strips that hang below the body like traditional
  # piñata paper fringe. Each is offset slightly on X/Z for width.
  leg_1:
    type: block_display
    parent: body
    block: minecraft:yellow_concrete
    transform:
      translation: [0.38, -1.15, 0.0]
      scale: [0.14, 0.9, 0.14]
    render:
      billboard: fixed
      brightnessBlock: 15

  leg_2:
    type: block_display
    parent: body
    block: minecraft:red_concrete
    transform:
      translation: [-0.38, -1.15, 0.0]
      scale: [0.14, 0.9, 0.14]
    render:
      billboard: fixed
      brightnessBlock: 15

  leg_3:
    type: block_display
    parent: body
    block: minecraft:lime_concrete
    transform:
      translation: [0.0, -1.15, 0.38]
      scale: [0.14, 0.9, 0.14]
    render:
      billboard: fixed
      brightnessBlock: 15

  leg_4:
    type: block_display
    parent: body
    block: minecraft:blue_concrete
    transform:
      translation: [0.0, -1.15, -0.38]
      scale: [0.14, 0.9, 0.14]
    render:
      billboard: fixed
      brightnessBlock: 15

  # --- Event label ---
  label:
    type: text_display
    parent: hook
    text: "<light_purple><bold>🎉 PIÑATA</bold></light_purple>"
    textAlignment: center
    transform:
      translation: [0.0, 1.2, 0.0]
    render:
      billboard: center
      viewRange: 80.0

# ---------------------------------------------------------------------------
# INTERACTIONS
# ---------------------------------------------------------------------------
interactions:
  # Covers the full body assembly including the top dome
  main:
    parent: body
    width: 2.5
    height: 3.2

# ---------------------------------------------------------------------------
# ANIMATIONS
# ---------------------------------------------------------------------------
animations:

  # ----- idle -----
  # The piñata swings like a pendulum from the hook point. The hook is the
  # rotation pivot so the whole assembly swings naturally.
  sway:
    duration: 2s
    loop: LOOP
    recovery: RESUME
    tracks:
      hook:
        rotation:
          - at: 0s
            value: [0.0, 0.0, -10.0]    # Swing left
            easing: ease_in_out
          - at: 1s
            value: [0.0, 0.0, 10.0]     # Swing right
            easing: ease_in_out
          - at: 2s
            value: [0.0, 0.0, -10.0]    # Back to left — seamless loop
      # Legs lag slightly behind the body for a secondary-motion effect
      leg_1:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 5.0]
            easing: ease_in_out
          - at: 1s
            value: [0.0, 0.0, -5.0]
            easing: ease_in_out
          - at: 2s
            value: [0.0, 0.0, 5.0]
      leg_2:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 5.0]
            easing: ease_in_out
          - at: 1s
            value: [0.0, 0.0, -5.0]
            easing: ease_in_out
          - at: 2s
            value: [0.0, 0.0, 5.0]

  # ----- hit -----
  # A punchy squash-and-stretch reaction to each player hit. Plays on every
  # "interaction" trigger and finishes in 350 ms to stay responsive.
  hit:
    duration: 350ms
    loop: ONCE
    recovery: STOP
    tracks:
      body:
        scale:
          - at: 0s
            value: [1.6, 2.0, 1.4]
          - at: 100ms
            value: [2.0, 1.4, 1.8]     # Squash on impact
            easing: ease_out
          - at: 200ms
            value: [1.4, 2.3, 1.2]     # Stretch rebound
            easing: ease_in_out
          - at: 350ms
            value: [1.6, 2.0, 1.4]     # Return to rest
      # Legs whip outward on impact
      leg_1:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 100ms
            value: [0.0, 0.0, 25.0]
            easing: ease_out
          - at: 350ms
            value: [0.0, 0.0, 0.0]
      leg_2:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 100ms
            value: [0.0, 0.0, -25.0]
            easing: ease_out
          - at: 350ms
            value: [0.0, 0.0, 0.0]

  # ----- break -----
  # The piñata shatters when the hit counter reaches max.
  # The body rapidly expands as if exploding, then disappears.
  break:
    duration: 600ms
    loop: ONCE
    recovery: STOP
    tracks:
      body:
        scale:
          - at: 0s
            value: [1.6, 2.0, 1.4]
          - at: 200ms
            value: [3.0, 3.5, 3.0]     # Explosive expansion
            easing: ease_out
          - at: 600ms
            value: [0.05, 0.05, 0.05]  # Disappears
            easing: ease_in
      # Legs fly outward as the piñata explodes
      leg_1:
        translation:
          - at: 0s
            value: [0.38, -1.15, 0.0]
          - at: 400ms
            value: [2.5, -1.5, 0.0]
            easing: ease_out
      leg_2:
        translation:
          - at: 0s
            value: [-0.38, -1.15, 0.0]
          - at: 400ms
            value: [-2.5, -1.5, 0.0]
            easing: ease_out
      leg_3:
        translation:
          - at: 0s
            value: [0.0, -1.15, 0.38]
          - at: 400ms
            value: [0.0, -1.5, 2.5]
            easing: ease_out
      leg_4:
        translation:
          - at: 0s
            value: [0.0, -1.15, -0.38]
          - at: 400ms
            value: [0.0, -1.5, -2.5]
            easing: ease_out
      hook:
        rotation:
          - at: 0s
            value: [0.0, 0.0, 0.0]
          - at: 300ms
            value: [0.0, 0.0, 45.0]    # Hook tips over as everything falls apart
            easing: ease_in
