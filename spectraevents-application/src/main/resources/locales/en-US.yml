event:
  # Text referenced by every player-facing action in events/airdrop.yml.
  airdrop:
    announced-message: "<gold><bold>[SpectraEvents]</bold> <yellow>Airdrop incoming. Watch the countdown.</yellow>"
    announced-bossbar: "<gold><bold>AIRDROP</bold> <dark_gray>◆</dark_gray> <white>Landing in %time_remaining%s</white>"
    falling-title: "<gold><bold>AIRDROP INCOMING</bold></gold>"
    falling-subtitle: "<yellow>Follow the landing coordinates</yellow>"
    falling-message: "<gold><bold>[SpectraEvents]</bold> <yellow>A supply crate is descending from the sky!</yellow>"
    locked-bossbar: "<yellow><bold>AIRDROP CRATE</bold> <dark_gray>◆</dark_gray> <red>LOCKED</red> <dark_gray>◆</dark_gray> <white>%time_remaining%s</white>"
    locked-message: "<gold><bold>[SpectraEvents]</bold> <yellow>Airdrop landed. The supply crate is locked.</yellow>"
    locked-interaction: "<red>The supply crate is locked. Wait for the countdown.</red>"
    open-bossbar: "<green><bold>AIRDROP OPEN</bold> <dark_gray>◆</dark_gray> <white>First loot: %time_remaining%s</white>"
    open-message: "<gold><bold>[SpectraEvents]</bold> <green><bold>Supply crate unlocked!</bold> Loot is public.</green>"
    loot-title: "Airdrop Supplies"
    looted-message: "<gold><bold>[SpectraEvents]</bold> <yellow>The Airdrop was opened. Remaining loot is public.</yellow>"
    empty-bossbar: "<gray><bold>AIRDROP EMPTY</bold> <dark_gray>◆</dark_gray> <white>Evacuating in %time_remaining%s</white>"
    evacuated-message: "<gold><bold>[SpectraEvents]</bold> <red>Airdrop evacuated: nobody took an item.</red>"
  # Text referenced by every player-facing action in events/boss-portal.yml.
  boss-portal:
    gathering-bossbar: "<dark_purple><bold>BOSS PORTAL</bold> <gray>| gathering | %location%"
    gathering-message: "<gold>[SpectraEvents]</gold> <dark_purple>Boss Portal gathering at %location%.</dark_purple>"
