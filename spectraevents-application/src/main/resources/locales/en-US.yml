    guard-name: "<dark_red>Meteor Guard</dark_red>"
    cataclysm-blaze-name: "<gold>Cataclysm Blaze</gold>"
    cataclysm-message: "<gold>[SpectraEvents]</gold> <dark_red>Cataclysm: defeat the Meteor Warden and its guards.</dark_red>"
    final-core-bossbar: "<light_purple><bold>METEOR FINAL CORE</bold> <gray>| %health%/%max_health% HP | %location%"
    final-core-message: "<gold>[SpectraEvents]</gold> <light_purple>The final Meteor core is exposed.</light_purple>"
