    manifestation-message: "<gold>[SpectraEvents]</gold> <dark_purple>Metin manifested at %location%.</dark_purple>"
    dominance-bossbar: "<dark_purple><bold>METIN</bold> <gray>| Dominance | %health%/%max_health% HP | %location%"
