# Reference large-raid encounter. One Metin model persists through every phase.
id: metin
schema-version: "1"
initial-phase: manifestation

encounter:
  zone-radius: 160
  deadline: 25m
  minimum-contribution: 100

phases:
  manifestation:
    on-enter:
      - type: initialize_health
        max: 1000
      - type: set_locked
        duration: 30s
      - type: spawn_model
        model: metin_stone
        height-offset: 0
      - type: play_animation
        animation: idle
      - type: spawn_particles
        particle: minecraft:portal
        count: 80
      - type: show_bossbar
        title: "<dark_purple><bold>METIN</bold> <gray>| %phase% | %health%/%max_health% HP | %location%"
        color: PURPLE
        style: NOTCHED_10
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <dark_purple>Metin manifested at %location%.</dark_purple>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 30s
        target: dominance

  dominance:
    on-enter:
      - type: set_locked
        duration: 0s
      - type: play_animation
        animation: idle
      - type: update_bossbar
        title: "<dark_purple><bold>METIN</bold> <gray>| Dominance | %health%/%max_health% HP | %location%"
        color: PURPLE
        style: NOTCHED_10
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <light_purple>Metin is vulnerable.</light_purple>"
    transitions:
      - trigger:
          type: interaction
        conditions:
          - type: not_locked
        actions:
          - type: apply_damage
            amount: 10
      - trigger:
          type: health_threshold_crossed
          threshold: 750
        target: fracture

  fracture:
    on-enter:
      - type: set_locked
        duration: 90s
      - type: play_animation
        animation: idle
      - type: spawn_particles
        particle: minecraft:crimson_spore
        count: 120
      - type: update_bossbar
        title: "<gold><bold>METIN FRACTURE</bold> <gray>| clear the wave | %location%"
        color: YELLOW
        style: NOTCHED_10
      - type: spawn_wave
        wave-id: fracture_guard
        mobs:
          - entity_type: minecraft:zombie
            name: "<dark_purple>Metin Fracture Guard</dark_purple>"
            amount: 12
            radius: 18
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <yellow>Metin fractured: clear its guards.</yellow>"
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: fracture_guard
        target: desperation
      - trigger:
          type: timer_elapsed
          duration: 90s
        target: desperation

  desperation:
    on-enter:
      - type: set_locked
        duration: 0s
      - type: play_animation
        animation: idle
      - type: spawn_particles
        particle: minecraft:reverse_portal
        count: 160
      - type: update_bossbar
        title: "<red><bold>METIN DESPERATION</bold> <gray>| %health%/%max_health% HP | %location%"
        color: RED
        style: NOTCHED_12
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <red>Metin has entered desperation.</red>"
    transitions:
      - trigger:
          type: interaction
        conditions:
          - type: not_locked
        actions:
          - type: apply_damage
            amount: 10
      - trigger:
          type: health_threshold_crossed
          threshold: 500
        actions:
          - type: set_locked
            duration: 90s
          - type: spawn_wave
            wave-id: desperation_guard
            mobs:
              - entity_type: minecraft:skeleton
                name: "<red>Metin Desperation Archer</red>"
                amount: 16
                radius: 22
      - trigger:
          type: wave_cleared
          wave-id: desperation_guard
        actions:
          - type: set_locked
            duration: 0s
      - trigger:
          type: health_threshold_crossed
          threshold: 250
        conditions:
          - type: not_locked
        target: final_assault

  final_assault:
    on-enter:
      - type: set_locked
        duration: 5m
      - type: play_animation
        animation: idle
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 12
      - type: update_bossbar
        title: "<dark_red><bold>FINAL ASSAULT</bold> <gray>| defeat the Defender and its wave | %location%"
        color: PINK
        style: PROGRESS
      - type: spawn_wave
        wave-id: final_assault
        mobs:
          - entity_type: minecraft:wither_skeleton
            name: "<dark_red><bold>Metin Defender</bold></dark_red>"
            amount: 1
            radius: 3
          - entity_type: minecraft:vindicator
            name: "<red>Metin Final Guard</red>"
            amount: 18
            radius: 24
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <dark_red>Final assault: defeat the Metin Defender.</dark_red>"
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: final_assault
        target: victory
      - trigger:
          type: timer_elapsed
          duration: 5m
        actions:
          - type: fail_event

  victory:
    on-enter:
      - type: play_animation
        animation: destroy
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 18
      # Pools are direct inventory delivery: first, second and third eligible damage contributor.
      - type: award_podium
        pools:
          - items:
              - material: minecraft:netherite_ingot
                amount: 3
                chance: 100
              - material: minecraft:diamond
                amount: 32
                chance: 100
          - items:
              - material: minecraft:netherite_ingot
                amount: 2
                chance: 100
              - material: minecraft:diamond
                amount: 20
                chance: 100
          - items:
              - material: minecraft:netherite_ingot
                amount: 1
                chance: 100
              - material: minecraft:diamond
                amount: 12
                chance: 100
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <green>Metin defeated. Podium rewards are being delivered.</green>"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event
