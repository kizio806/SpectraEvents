# =============================================================================
# SpectraEvents — Event Definition: Metin
# =============================================================================
# A persistent Metin stone raid. One model remains through every phase while
# damage thresholds spawn configured guard waves and unlock the final defense.
#
# This definition intentionally has no GUI-editable scalar parameters. Edit its
# YAML deliberately, validate it, then reload definitions before starting it.
#
# FIELD GUIDE: `initialize_health` owns the persistent target HP; `set_locked` controls whether
# interaction damage is accepted. A `health_threshold_crossed` trigger runs once when crossing the
# stated absolute HP value. Each `spawn_wave` uses a stable wave-id consumed by `wave_cleared`.
# `i18n:` names, messages and HUD titles resolve for the selected server locale at runtime. The
# podium pools are ranked reward delivery: inventory first, otherwise the item drops at the winner.
# =============================================================================

# Stable machine identifier used in commands, schedules and overrides.
id: metin
# Event definition schema accepted by the compiler.
schema-version: "1"
# First state entered when the event starts.
initial-phase: manifestation

encounter:
  zone-radius: 160
  deadline: 25m
  minimum-contribution: 100

phases:
  manifestation:
    # Create the stone, lock it for the arrival sequence, and announce its location.
    on-enter:
      - type: initialize_health
        max: 1000
      - type: set_locked
        duration: 30s
      - type: spawn_model
        model: metin_stone
        height-offset: 0
      - type: play_animation
        animation: idle
      - type: play_sound
        sound: minecraft:block.end_portal.spawn
        volume: 1.0
        pitch: 0.8
      - type: spawn_particles
        particle: minecraft:portal
        count: 80
      - type: show_bossbar
        title: "i18n:event.metin.manifestation-bossbar"
        color: PURPLE
        style: NOTCHED_10
      - type: broadcast_message
        message: "i18n:event.metin.manifestation-message"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 30s
        target: dominance

  dominance:
    # Normal damage phase; the 750 HP threshold begins the first defensive wave.
    on-enter:
      - type: set_locked
        duration: 0s
      - type: play_animation
        animation: idle
      - type: update_bossbar
        title: "i18n:event.metin.dominance-bossbar"
        color: PURPLE
        style: NOTCHED_10
      - type: broadcast_message
        message: "i18n:event.metin.dominance-message"
    transitions:
      - trigger:
          type: interaction
        conditions:
          - type: not_locked
        actions:
          - type: play_animation
            animation: hit
          - type: play_sound
            sound: minecraft:block.amethyst_block.hit
            volume: 1.0
            pitch: 0.9
          - type: apply_damage
            amount: 10
      - trigger:
          type: health_threshold_crossed
          threshold: 750
        target: fracture

  fracture:
    # The event waits up to 90 seconds for the named guard wave, then continues either way.
    on-enter:
      - type: set_locked
        duration: 90s
      - type: play_animation
        animation: idle
      - type: spawn_particles
        particle: minecraft:crimson_spore
        count: 120
      - type: update_bossbar
        title: "i18n:event.metin.fracture-bossbar"
        color: YELLOW
        style: NOTCHED_10
      - type: spawn_wave
        wave-id: fracture_guard
        mobs:
          - entity_type: minecraft:zombie
            name: "i18n:event.metin.fracture-guard-name"
            amount: 12
            radius: 18
      - type: broadcast_message
        message: "i18n:event.metin.fracture-message"
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: fracture_guard
        target: desperation
      - trigger:
          type: timer_elapsed
          duration: 90s
        target: desperation

  desperation:
    # At 500 HP a temporary archer wave locks damage; at 250 HP the final assault starts.
    on-enter:
      - type: set_locked
        duration: 0s
      - type: play_animation
        animation: idle
      - type: spawn_particles
        particle: minecraft:reverse_portal
        count: 160
      - type: update_bossbar
        title: "i18n:event.metin.desperation-bossbar"
        color: RED
        style: NOTCHED_12
      - type: broadcast_message
        message: "i18n:event.metin.desperation-message"
    transitions:
      - trigger:
          type: interaction
        conditions:
          - type: not_locked
        actions:
          - type: play_animation
            animation: hit
          - type: play_sound
            sound: minecraft:block.amethyst_block.hit
            volume: 1.0
            pitch: 0.9
          - type: apply_damage
            amount: 10
      - trigger:
          type: health_threshold_crossed
          threshold: 500
        actions:
          - type: set_locked
            duration: 90s
          - type: spawn_wave
            wave-id: desperation_guard
            mobs:
              - entity_type: minecraft:skeleton
                name: "i18n:event.metin.desperation-archer-name"
                amount: 16
                radius: 22
      - trigger:
          type: wave_cleared
          wave-id: desperation_guard
        actions:
          - type: set_locked
            duration: 0s
      - trigger:
          type: health_threshold_crossed
          threshold: 250
        conditions:
          - type: not_locked
        target: final_assault

  final_assault:
    # The defender wave must die before five minutes. Timeout fails the event without rewards.
    on-enter:
      - type: set_locked
        duration: 5m
      - type: play_animation
        animation: idle
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 12
      - type: update_bossbar
        title: "i18n:event.metin.final-assault-bossbar"
        color: PINK
        style: PROGRESS
      - type: spawn_wave
        wave-id: final_assault
        mobs:
          - entity_type: minecraft:wither_skeleton
            name: "i18n:event.metin.defender-name"
            amount: 1
            radius: 3
          - entity_type: minecraft:vindicator
            name: "i18n:event.metin.final-guard-name"
            amount: 18
            radius: 24
      - type: broadcast_message
        message: "i18n:event.metin.final-assault-message"
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: final_assault
        target: victory
      - trigger:
          type: timer_elapsed
          duration: 5m
        actions:
          - type: fail_event

  victory:
    # Terminal success cleans visual state only after all direct podium delivery was attempted.
    on-enter:
      - type: play_animation
        animation: destroy
      - type: play_sound
        sound: minecraft:ui.toast.challenge_complete
        volume: 1.0
        pitch: 1.0
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 18
      # Pools are direct inventory delivery: first, second and third eligible damage contributor.
      - type: award_podium
        pools:
          - items:
              - material: minecraft:netherite_ingot
                amount: 3
                chance: 100
              - material: minecraft:diamond
                amount: 32
                chance: 100
          - items:
              - material: minecraft:netherite_ingot
                amount: 2
                chance: 100
              - material: minecraft:diamond
                amount: 20
                chance: 100
          - items:
              - material: minecraft:netherite_ingot
                amount: 1
                chance: 100
              - material: minecraft:diamond
                amount: 12
                chance: 100
      - type: broadcast_message
        message: "i18n:event.metin.victory-message"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event
