# Reference large-raid encounter. YAML owns waves and loot; only bounded scalar values are GUI-editable.
id: meteor
schema-version: "1"
initial-phase: announced

parameters:
  maximum-health:
    type: integer
    default: 1000000
    min: 10000
    max: 5000000
    step: 10000
    gui-editable: true
  maximum-hit-damage:
    type: integer
    default: 50
    min: 1
    max: 1000
    step: 1
    gui-editable: true
  hit-cooldown:
    type: duration
    default: 1s
    min: 1
    max: 5
    step: 1
    gui-editable: true
  announcement-duration:
    type: duration
    default: 3m
    min: 30
    max: 600
    step: 30
    gui-editable: true
  impact-lock-duration:
    type: duration
    default: 45s
    min: 15
    max: 120
    step: 15
    gui-editable: true
  first-gate-timeout:
    type: duration
    default: 2m
    min: 30
    max: 300
    step: 30
    gui-editable: true
  second-gate-timeout:
    type: duration
    default: 2m
    min: 30
    max: 300
    step: 30
    gui-editable: true
  final-gate-timeout:
    type: duration
    default: 3m
    min: 30
    max: 300
    step: 30
    gui-editable: true
  zone-radius:
    type: decimal
    default: 160
    min: 32
    max: 512
    step: 16
    gui-editable: true
  deadline:
    type: duration
    default: 20m
    min: 300
    max: 3600
    step: 60
    gui-editable: true

encounter:
  zone-radius: ${zone-radius}
  deadline: ${deadline}

phases:
  announced:
    on-enter:
      - type: initialize_health
        max: ${maximum-health}
      - type: show_bossbar
        title: "<red><bold>METEOR INCOMING</bold> <gray>| warning active | %location%"
        color: RED
        style: NOTCHED_10
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <red>A Meteor will strike at %location%. Prepare for impact.</red>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: ${announcement-duration}
        target: falling

  falling:
    on-enter:
      - type: spawn_model
        model: meteor_core
        height-offset: 20
      - type: play_animation
        animation: fall
      - type: update_bossbar
        title: "<red><bold>METEOR FALLING</bold> <gray>| impact imminent | %location%"
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <red>The Meteor is descending at %location%.</red>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 15s
        target: impact_lock

  impact_lock:
    on-enter:
      - type: move_model
        target: ground
      - type: play_animation
        animation: impact
      - type: play_sound
        sound: minecraft:entity.generic.explode
        volume: 1.0
        pitch: 0.8
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 12
      - type: set_locked
        duration: ${impact-lock-duration}
      - type: update_bossbar
        title: "<gold><bold>METEOR IMPACT</bold> <gray>| core cooling | %location%"
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <yellow>The Meteor has struck. Its core is still unstable.</yellow>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: ${impact-lock-duration}
        target: assault_one

  assault_one:
    on-enter:
      - type: set_locked
        duration: 0s
      - type: play_animation
        animation: impact
      - type: update_bossbar
        title: "<gold><bold>METEOR</bold> <gray>| Assault I | %health%/%max_health% HP | %location%"
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <green>The Meteor core is vulnerable.</green>"
    transitions:
      - trigger:
          type: combat_damage
        conditions:
          - type: not_locked
        actions:
          - type: apply_combat_damage
            maximum: ${maximum-hit-damage}
            cooldown: ${hit-cooldown}
            health-floor-percent: 75
      - trigger:
          type: health_percent_threshold_crossed
          percent: 75
        target: fracture_guard

  fracture_guard:
    on-enter:
      - type: set_locked
        duration: ${first-gate-timeout}
      - type: spawn_particles
        particle: minecraft:lava
        count: 80
      - type: update_bossbar
        title: "<yellow><bold>METEOR FRACTURE</bold> <gray>| clear the guardians | %location%"
      - type: spawn_wave
        wave-id: fracture_guard
        mobs:
          - entity_type: minecraft:magma_cube
            name: "<red>Meteor Fragment</red>"
            amount: 12
            radius: 18
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <yellow>Fracture: clear the Meteor fragments.</yellow>"
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: fracture_guard
        target: assault_two
      - trigger:
          type: timer_elapsed
          duration: ${first-gate-timeout}
        target: failed

  assault_two:
    on-enter:
      - type: set_locked
        duration: 0s
      - type: play_animation
        animation: impact
      - type: update_bossbar
        title: "<gold><bold>METEOR</bold> <gray>| Assault II | %health%/%max_health% HP | %location%"
    transitions:
      - trigger:
          type: combat_damage
        conditions:
          - type: not_locked
        actions:
          - type: apply_combat_damage
            maximum: ${maximum-hit-damage}
            cooldown: ${hit-cooldown}
            health-floor-percent: 50
      - trigger:
          type: health_percent_threshold_crossed
          percent: 50
        target: eruption_guard

  eruption_guard:
    on-enter:
      - type: set_locked
        duration: ${second-gate-timeout}
      - type: spawn_particles
        particle: minecraft:flame
        count: 110
      - type: update_bossbar
        title: "<gold><bold>METEOR ERUPTION</bold> <gray>| contain the eruption | %location%"
      - type: spawn_wave
        wave-id: eruption_guard
        mobs:
          - entity_type: minecraft:blaze
            name: "<gold>Infernal Meteor Blaze</gold>"
            amount: 8
            radius: 20
          - entity_type: minecraft:magma_cube
            name: "<red>Molten Fragment</red>"
            amount: 10
            radius: 20
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <gold>Eruption: contain the blazing guardians.</gold>"
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: eruption_guard
        target: assault_three
      - trigger:
          type: timer_elapsed
          duration: ${second-gate-timeout}
        target: failed

  assault_three:
    on-enter:
      - type: set_locked
        duration: 0s
      - type: play_animation
        animation: impact
      - type: update_bossbar
        title: "<red><bold>METEOR</bold> <gray>| Assault III | %health%/%max_health% HP | %location%"
    transitions:
      - trigger:
          type: combat_damage
        conditions:
          - type: not_locked
        actions:
          - type: apply_combat_damage
            maximum: ${maximum-hit-damage}
            cooldown: ${hit-cooldown}
            health-floor-percent: 25
      - trigger:
          type: health_percent_threshold_crossed
          percent: 25
        target: cataclysm

  cataclysm:
    on-enter:
      - type: set_locked
        duration: ${final-gate-timeout}
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 18
      - type: update_bossbar
        title: "<dark_red><bold>METEOR CATACLYSM</bold> <gray>| defeat the Warden | %location%"
      - type: spawn_wave
        wave-id: cataclysm_guard
        mobs:
          - entity_type: minecraft:ravager
            name: "<dark_red><bold>Meteor Warden</bold></dark_red>"
            amount: 1
            radius: 4
          - entity_type: minecraft:wither_skeleton
            name: "<dark_red>Meteor Guard</dark_red>"
            amount: 12
            radius: 24
          - entity_type: minecraft:blaze
            name: "<gold>Cataclysm Blaze</gold>"
            amount: 8
            radius: 24
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <dark_red>Cataclysm: defeat the Meteor Warden and its guards.</dark_red>"
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: cataclysm_guard
        target: final_core
      - trigger:
          type: timer_elapsed
          duration: ${final-gate-timeout}
        target: failed

  final_core:
    on-enter:
      - type: set_locked
        duration: 0s
      - type: update_bossbar
        title: "<light_purple><bold>METEOR FINAL CORE</bold> <gray>| %health%/%max_health% HP | %location%"
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <light_purple>The final Meteor core is exposed.</light_purple>"
    transitions:
      - trigger:
          type: combat_damage
        conditions:
          - type: not_locked
        actions:
          - type: apply_combat_damage
            maximum: ${maximum-hit-damage}
            cooldown: ${hit-cooldown}
            health-floor-percent: 0
      - trigger:
          type: health_depleted
        target: victory

  victory:
    on-enter:
      - type: play_animation
        animation: collapse
      - type: play_sound
        sound: minecraft:ui.toast.challenge_complete
        volume: 1.0
        pitch: 1.0
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 18
      - type: initialize_ground_loot
        items:
          - material: minecraft:netherite_ingot
            amount: 2
            chance: 75
          - material: minecraft:diamond
            amount: 12
            chance: 100
          - material: minecraft:enchanted_golden_apple
            amount: 2
            chance: 50
          - material: minecraft:emerald
            amount: 32
            chance: 100
      - type: release_ground_loot
        radius: 4.0
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <green>The Meteor was destroyed. Public loot has fallen at %location%.</green>"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event

  failed:
    on-enter:
      - type: play_sound
        sound: minecraft:entity.generic.explode
        volume: 1.0
        pitch: 0.6
      - type: spawn_particles
        particle: minecraft:explosion_emitter
        count: 24
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <dark_red>The Meteor became unstable and exploded. No loot was recovered.</dark_red>"
      - type: remove_bossbar
      - type: remove_model
      - type: fail_event
