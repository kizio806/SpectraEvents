# =============================================================================
# SpectraEvents — Event Definition: Piñata
# =============================================================================
# A short social event: players right-click the model to fill the hit progress
# bar. Reaching the goal grants participant rewards; timeout fails the event.
#
# All player-facing Piñata text uses i18n: keys from locales/<locale>.yml.
# Durations use ms, s, m or h; min, max and step for duration parameters are seconds.
#
# FIELD GUIDE: `announcement-duration`, `goal-hits` and `active-duration` are the only admin GUI
# values. `initialize_hit_counter` makes `hits` progress available to the boss bar. Every
# interaction increments exactly one hit; the 75% threshold changes only presentation to frenzy.
# `create_participant_reward_claims` delivers each earned item directly to a player's inventory,
# dropping it at that player's location if full. `i18n:` always points at locales/<selected>.yml.
# =============================================================================

id: pinata
schema-version: "1"
initial-phase: announced

encounter:
  zone-radius: 96
  deadline: 11m

limits:
  max-active-per-world: 1

parameters:
  announcement-duration:
    type: duration
    default: 60s
    min: 30
    max: 300
    step: 15
    gui-editable: true
  goal-hits:
    type: integer
    default: 100
    min: 10
    max: 10000
    step: 10
    gui-editable: true
  active-duration:
    type: duration
    default: 10m
    min: 60
    max: 1800
    step: 60
    gui-editable: true

phases:
  announced:
    on-enter:
      - type: show_bossbar
        title: "i18n:event.pinata.countdown"
        color: PINK
        style: PROGRESS
      - type: broadcast_message
        message: "i18n:event.pinata.announced"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: ${announcement-duration}
        target: manifestation

  manifestation:
    on-enter:
      - type: initialize_hit_counter
        max: ${goal-hits}
      - type: spawn_model
        model: pinata
        height-offset: 4
      - type: play_animation
        animation: idle
        loop: LOOP
      - type: show_title
        title: "i18n:event.pinata.started-title"
        subtitle: "i18n:event.pinata.started-subtitle"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 1s
        target: active

  active:
    on-enter:
      - type: update_bossbar
        title: "i18n:event.pinata.hits"
        progress: hits
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: play_animation
            animation: hit
            loop: ONCE
          - type: increment_hits
          - type: update_bossbar
            title: "i18n:event.pinata.hits"
            progress: hits
          - type: send_message
            message: "i18n:event.pinata.hit-confirmation"
      - trigger:
          type: hits_percent_threshold_crossed
          percent: 75
        target: frenzy
      - trigger:
          type: hits_reached
        target: victory
      - trigger:
          type: timer_elapsed
          duration: ${active-duration}
        actions:
          - type: fail_event

  frenzy:
    on-enter:
      - type: spawn_particles
        particle: minecraft:firework
        count: 80
      - type: update_bossbar
        title: "i18n:event.pinata.frenzy"
        progress: hits
      - type: broadcast_message
        message: "i18n:event.pinata.frenzy-announced"
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: play_animation
            animation: hit
            loop: ONCE
          - type: increment_hits
          - type: update_bossbar
            title: "i18n:event.pinata.frenzy"
            progress: hits
      - trigger:
          type: hits_reached
        target: victory
      - trigger:
          type: timer_elapsed
          duration: ${active-duration}
        actions:
          - type: fail_event

  victory:
    on-enter:
      - type: play_animation
        animation: destroy
        loop: ONCE
      - type: create_participant_reward_claims
        items:
          - material: minecraft:diamond
            amount: 2
            chance: 100
          - material: minecraft:golden_apple
            amount: 1
            chance: 70
      - type: broadcast_message
        message: "i18n:event.pinata.completed"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event
