id: pinata
schema-version: "1"
initial-phase: announced

encounter:
  zone-radius: 96
  deadline: 11m

limits:
  max-active-per-world: 1

parameters:
  announcement-duration:
    type: duration
    default: 60s
    min: 30
    max: 300
    step: 15
    gui-editable: true
  goal-hits:
    type: integer
    default: 100
    min: 10
    max: 10000
    step: 10
    gui-editable: true
  active-duration:
    type: duration
    default: 10m
    min: 60
    max: 1800
    step: 60
    gui-editable: true

phases:
  announced:
    on-enter:
      - type: show_bossbar
        title: "<light_purple><bold>PIÑATA</bold> <gray>| manifesting in 60s | %location%"
        color: PINK
        style: PROGRESS
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <light_purple>Piñata announced at %location%.</light_purple>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: ${announcement-duration}
        target: manifestation

  manifestation:
    on-enter:
      - type: initialize_hit_counter
        max: ${goal-hits}
      - type: spawn_model
        model: pinata
        height-offset: 4
      - type: play_animation
        animation: sway
        loop: LOOP
      - type: show_title
        title: "<light_purple><bold>PIÑATA EVENT"
        subtitle: "<yellow>Right-click to hit it!"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 1s
        target: active

  active:
    on-enter:
      - type: update_bossbar
        title: "<light_purple><bold>PIÑATA</bold> <yellow>%hits%/%max_hits%</yellow> <gray>| %location%"
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: play_animation
            animation: hit
            loop: ONCE
          - type: increment_hits
          - type: update_bossbar
            title: "<light_purple><bold>PIÑATA</bold> <yellow>%hits%/%max_hits%</yellow> <gray>| %location%"
          - type: send_message
            message: "<green>+1 hit: <yellow>%hits%/%max_hits%</yellow></green>"
      - trigger:
          type: hits_percent_threshold_crossed
          percent: 75
        target: frenzy
      - trigger:
          type: hits_reached
        target: victory
      - trigger:
          type: timer_elapsed
          duration: ${active-duration}
        actions:
          - type: fail_event

  frenzy:
    on-enter:
      - type: spawn_particles
        particle: minecraft:firework
        count: 80
      - type: update_bossbar
        title: "<gold><bold>PIÑATA FRENZY</bold> <yellow>%hits%/%max_hits%</yellow> <gray>| %location%"
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <yellow>Piñata frenzy at 75%!</yellow>"
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: play_animation
            animation: hit
            loop: ONCE
          - type: increment_hits
          - type: update_bossbar
            title: "<gold><bold>PIÑATA FRENZY</bold> <yellow>%hits%/%max_hits%</yellow> <gray>| %location%"
      - trigger:
          type: hits_reached
        target: victory
      - trigger:
          type: timer_elapsed
          duration: ${active-duration}
        actions:
          - type: fail_event

  victory:
    on-enter:
      - type: play_animation
        animation: break
        loop: ONCE
      - type: create_participant_reward_claims
        items:
          - material: minecraft:diamond
            amount: 2
            chance: 100
          - material: minecraft:golden_apple
            amount: 1
            chance: 70
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <light_purple>Piñata broken. Rewards are in /se rewards.</light_purple>"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event
