id: pinata
schema-version: "1"
initial-phase: active

phases:
  active:
    on-enter:
      - type: initialize_hit_counter
        max: 20
      - type: spawn_model
        model: dev_pinata_model
      - type: play_animation
        model: dev_pinata_model
        animation: sway
        loop: LOOP
      - type: show_bossbar
        title: "<light_purple><bold>PIÑATA</bold> <white>Hit it 20 times!"
        color: PINK
        style: PROGRESS
      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <light_purple>A Piñata appeared! Every interaction counts as one hit.</light_purple>"
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: play_sound
            sound: minecraft:block.wool.hit
            volume: 1.0
            pitch: 1.2
          - type: spawn_particles
            particle: minecraft:happy_villager
            count: 5
          - type: increment_hits
      - trigger:
          type: hits_reached
        target: broken

  broken:
    on-enter:
      - type: play_sound
        sound: minecraft:entity.firework_rocket.large_blast
        volume: 1.0
        pitch: 1.0
      - type: spawn_particles
        particle: minecraft:firework
        count: 25
      - type: drop_loot
        radius: 2.0
        items:
          - material: minecraft:cookie
            amount: 16
            chance: 100
          - material: minecraft:gold_nugget
            amount: 24
            chance: 100
          - material: minecraft:diamond
            amount: 1
            chance: 25
      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <green>The Piñata broke! Collect the rewards.</green>"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event

  completed: {}
