id: boss_portal
schema-version: "1"
initial-phase: gathering

encounter:
  zone-radius: 128
  deadline: 25m
  minimum-contribution: 1

limits:
  max-active-per-world: 1

parameters:
  gathering-duration:
    type: duration
    default: 5m
    min: 60
    max: 900
    step: 30
    gui-editable: true

phases:
  gathering:
    on-enter:
      - type: spawn_model
        model: boss_portal
      - type: play_animation
        animation: opening
        loop: ONCE
      - type: show_bossbar
        title: "<dark_purple><bold>BOSS PORTAL</bold> <gray>| gathering | %location%"
        color: PURPLE
        style: PROGRESS
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <dark_purple>Boss Portal gathering at %location%.</dark_purple>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: ${gathering-duration}
        target: first-wave

  first-wave:
    on-enter:
      - type: play_animation
        animation: active
        loop: LOOP
      - type: update_bossbar
        title: "<dark_purple><bold>BOSS PORTAL</bold> <gray>| first defense wave | %location%"
      - type: spawn_wave
        wave-id: portal-vanguard
        mobs:
          - entity_type: minecraft:enderman
            name: "<dark_purple>Portal Vanguard</dark_purple>"
            amount: 12
            radius: 20
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: portal-vanguard
        target: second-wave

  second-wave:
    on-enter:
      - type: update_bossbar
        title: "<dark_purple><bold>BOSS PORTAL</bold> <gray>| second defense wave | %location%"
      - type: spawn_wave
        wave-id: portal-wardens
        mobs:
          - entity_type: minecraft:evoker
            name: "<dark_purple>Portal Warden</dark_purple>"
            amount: 4
            radius: 16
          - entity_type: minecraft:vindicator
            name: "<red>Rift Guard</red>"
            amount: 16
            radius: 24
    transitions:
      - trigger:
          type: wave_cleared
          wave-id: portal-wardens
        target: boss

  boss:
    on-enter:
      - type: spawn_boss
        entity_type: minecraft:wither_skeleton
        name: "<dark_red><bold>PORTAL OVERLORD</bold></dark_red>"
        offset-x: 0
        offset-y: 0
        offset-z: 2
      - type: update_bossbar
        title: "<dark_red><bold>PORTAL OVERLORD</bold> <gray>| defeat before enrage | %location%"
    transitions:
      - trigger:
          type: entity_death
        target: victory
      - trigger:
          type: timer_elapsed
          duration: 10m
        target: enrage

  enrage:
    on-enter:
      - type: spawn_particles
        particle: minecraft:dragon_breath
        count: 120
      - type: update_bossbar
        title: "<red><bold>PORTAL OVERLORD ENRAGED</bold> <gray>| finish the raid | %location%"
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <red>The Portal Overlord is enraged.</red>"
    transitions:
      - trigger:
          type: entity_death
        target: victory
      - trigger:
          type: timer_elapsed
          duration: 10m
        actions:
          - type: fail_event

  victory:
    on-enter:
      - type: create_participant_reward_claims
        items:
          - material: minecraft:diamond
            amount: 8
            chance: 100
          - material: minecraft:golden_apple
            amount: 2
            chance: 100
      - type: award_podium
        pools:
          - items:
              - material: minecraft:netherite_ingot
                amount: 3
                chance: 100
          - items:
              - material: minecraft:netherite_ingot
                amount: 2
                chance: 100
          - items:
              - material: minecraft:netherite_ingot
                amount: 1
                chance: 100
      - type: broadcast_message
        message: "<gold>[SpectraEvents]</gold> <green>Boss Portal conquered. Personal rewards are in /se rewards.</green>"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event
