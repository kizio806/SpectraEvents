# =============================================================================
# SpectraEvents — Event Definition: Airdrop
# =============================================================================
# A military-style supply crate descends from the sky on a parachute.
# It lands, remains locked for a countdown, then exposes a durable public inventory.
#
# PHASES
#   announced → falling → locked → open → looted → empty_display → completed
#
# Timings are YAML-owned. Only declared scalar values are editable through commands/GUI.
# =============================================================================

id: airdrop
schema-version: "1"
initial-phase: announced

parameters:
  announcement-delay:
    type: duration
    default: 15m
    min: 60
    max: 3600
    step: 60
    gui-editable: true
  lock-duration:
    type: duration
    default: 5m
    min: 30
    max: 1800
    step: 30
    gui-editable: true
  first-loot-window:
    type: duration
    default: 15m
    min: 60
    max: 3600
    step: 60
    gui-editable: true
  empty-display-duration:
    type: duration
    default: 5m
    min: 30
    max: 1800
    step: 30
    gui-editable: true

encounter:
  zone-radius: 128
  deadline: 45m

phases:
  announced:
    on-enter:
      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <yellow>Airdrop incoming in 15 minutes.</yellow>"
      - type: show_bossbar
        title: "<gold>AIRDROP</gold> <gray>Landing in 15m</gray>"
        color: YELLOW
        style: PROGRESS
    transitions:
      - trigger:
          type: timer_elapsed
          duration: ${announcement-delay}
        target: falling


  # ---------------------------------------------------------------------------
  # PHASE: falling
  # The crate and parachute assembly descend. The "descent" animation moves
  # the model slowly downward. A title and broadcast announce the event.
  # After the short landing sequence the crate enters the locked phase.
  # ---------------------------------------------------------------------------
  falling:
    on-enter:
      # height-offset: The crate spawns 15 blocks in the air so the descent
      # animation is visible to players on the ground.
      - type: spawn_model
        model: airdrop_crate
        height-offset: 15

      - type: play_animation
        model: airdrop_crate
        animation: fall
        loop: ONCE

      - type: show_title
        title: "<gold><bold>AIRDROP INCOMING"
        subtitle: "<yellow>Follow the landing coordinates"

      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <yellow>A Supply Airdrop is descending from the sky!</yellow>"

    transitions:
      - trigger:
          type: timer_elapsed
          duration: 3s
        target: locked

  # ---------------------------------------------------------------------------
  # PHASE: locked
  # The crate is on the ground but sealed. Players see a countdown bossbar.
  # If they try to interact early they receive a "locked" personal message.
  # set_locked duration matches the declared operator parameter.
  # ---------------------------------------------------------------------------
  locked:
    on-enter:
      # land animation: parachute collapses, crate bounces on landing.
      # move_model: lower the crate to ground level after the descent.
      - type: move_model
        target: ground

      # set_locked: prevents the claim from being accepted until the duration
      # has elapsed. Operator can adjust via lock-duration config setting.
      - type: set_locked
        duration: ${lock-duration}

      - type: play_sound
        sound: minecraft:block.wood.place
        volume: 1.0
        pitch: 0.5                 # Low pitch = heavy wooden thud

      - type: spawn_particles
        particle: minecraft:cloud
        count: 20

      # The shared HUD manager refreshes the active phase and remaining time each second.
      - type: show_bossbar
        title: "<yellow><bold>AIRDROP CRATE</bold> <gray>[locked]</gray>"
        color: YELLOW
        style: PROGRESS

      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <yellow>Airdrop landed! The Supply Crate is locked.</yellow>"

    transitions:
      # Unlock timer — duration matches lock-duration operator override.
      - trigger:
          type: timer_elapsed
          duration: ${lock-duration}
        target: open

      # Early interaction: deliver a "come back later" message only to the
      # triggering player. No phase change — stays in "locked".
      - trigger:
          type: interaction
        actions:
          - type: send_message
            message: "<red>The Supply Crate is locked! Please wait for the countdown timer.</red>"

  # ---------------------------------------------------------------------------
  # PHASE: open
  # The crate unlocks as a public shared inventory. The first withdrawal is announced,
  # but it does not reserve the remaining slots for that player.
  # ---------------------------------------------------------------------------
  open:
    on-enter:
      - type: initialize_shared_loot
        items:
          - material: minecraft:diamond
            amount: 5
          - material: minecraft:golden_apple
            amount: 4
          - material: minecraft:netherite_upgrade_smithing_template
            amount: 1
          - material: minecraft:experience_bottle
            amount: 16
      # Play the lid-opening animation.
      - type: play_animation
        model: airdrop_crate
        animation: open
        loop: ONCE

      - type: play_sound
        sound: minecraft:block.chest.open
        volume: 1.0
        pitch: 1.0

      - type: spawn_particles
        particle: minecraft:happy_villager
        count: 20

      - type: update_bossbar
        title: "<green><bold>AIRDROP OPEN</bold> <white>First loot: 15m</white>"

      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <green><bold>Supply Crate Unlocked!</bold> Loot is public.</green>"

    transitions:
      - trigger:
          type: interaction
        actions:
          - type: open_shared_loot
            title: "Airdrop Supplies"
      - trigger:
          type: timer_elapsed
          duration: ${first-loot-window}
        target: evacuated
      - trigger:
          type: loot_item_taken
        target: looted

  looted:
    on-enter:
      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <yellow>The Airdrop was opened. Remaining loot is public.</yellow>"
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: open_shared_loot
            title: "Airdrop Supplies"
      - trigger:
          type: loot_container_emptied
        target: empty_display

  empty_display:
    on-enter:
      - type: update_bossbar
        title: "<gray><bold>AIRDROP EMPTY</bold> <white>Evacuating in 5m</white>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: ${empty-display-duration}
        target: completed

  evacuated:
    on-enter:
      - type: broadcast_message
        message: "<gold><bold>[SpectraEvents]</bold> <red>Airdrop evacuated: nobody took an item.</red>"
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event

  # ---------------------------------------------------------------------------
  # PHASE: completed
  # Terminal state required by the schema. No actions necessary.
  # ---------------------------------------------------------------------------
  completed:
    on-enter:
      - type: remove_bossbar
      - type: remove_model
      - type: complete_event
