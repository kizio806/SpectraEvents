name: SpectraEvents
version: '${version}'
main: io.github.kizio806.spectraevents.platform.paper.SpectraEventsPlugin
description: Modular, data-driven 3D event engine for Paper servers.
authors:
  - kizio806
website: https://github.com/kizio806/SpectraEvents
api-version: '26.1'
folia-supported: true
load: POSTWORLD

permissions:
  spectraevents.admin:
    description: "Grants access to all SpectraEvents admin features."
    default: op
    children:
      spectraevents.event.*: true
      spectraevents.definition.*: true
      spectraevents.template: true
      spectraevents.update.*: true
      spectraevents.gui: true
      spectraevents.status: true
      spectraevents.doctor: true
      spectraevents.integrations: true
      spectraevents.rewards.claim: true
      spectraevents.schedule: true
      spectraevents.admin.assets: true
      spectraevents.admin.model: true

  spectraevents.event.*:
    description: "Grants access to all event management commands."
    default: op
    children:
      spectraevents.event.list: true
      spectraevents.event.start: true
      spectraevents.event.cancel: true
      spectraevents.event.trigger: true
      spectraevents.event.inspect: true

  spectraevents.event.list:
    description: "Allows listing active events."
    default: op

  spectraevents.event.start:
    description: "Allows starting events."
    default: op

  spectraevents.event.cancel:
    description: "Allows cancelling events."
    default: op

  spectraevents.event.trigger:
    description: "Allows manually triggering an event transition for diagnostics."
    default: op

  spectraevents.event.inspect:
    description: "Allows inspecting event runtime cleanup and recovery state."
    default: op

  spectraevents.definition.*:
    description: "Grants access to all definition management commands."
    default: op
    children:
      spectraevents.definition.list: true
      spectraevents.definition.reload: true
      spectraevents.definition.validate: true

  spectraevents.definition.list:
    description: "Allows listing registered event definitions."
    default: op

  spectraevents.definition.reload:
    description: "Allows reloading event definitions from config."
    default: op

  spectraevents.definition.validate:
    description: "Allows validating event definitions."
    default: op

  spectraevents.template:
    description: "Allows listing and installing bundled event templates."
    default: op

  spectraevents.update.*:
    description: "Grants access to all update management commands."
    default: op
    children:
      spectraevents.update.check: true
      spectraevents.update.info: true
      spectraevents.update.notify: true

  spectraevents.update.check:
    description: "Allows checking for updates manually."
    default: op

  spectraevents.update.info:
    description: "Allows viewing current version info."
    default: op

  spectraevents.update.notify:
    description: "Receives update notifications on join."
    default: op

  spectraevents.gui:
    description: "Allows opening the SpectraEvents admin GUI."
    default: op

  spectraevents.status:
    description: "Allows checking engine status."
    default: op

  spectraevents.doctor:
    description: "Allows running diagnostic doctor command."
    default: op

  spectraevents.integrations:
    description: "Allows checking integration status."
    default: op

  spectraevents.rewards.claim:
    description: "Allows a player to list and claim their own durable rewards."
    default: true

  spectraevents.schedule:
    description: "Allows listing and reloading configured event schedules."
    default: op

  spectraevents.admin.assets:
    description: "Grants access to Paper asset-pipeline commands."
    default: op
    children:
      spectraevents.admin.assets.build: true
      spectraevents.admin.assets.import: true
      spectraevents.admin.assets.info: true
      spectraevents.admin.assets.list: true
      spectraevents.admin.assets.validate: true
  spectraevents.admin.assets.build:
    default: op
  spectraevents.admin.assets.import:
    default: op
  spectraevents.admin.assets.info:
    default: op
  spectraevents.admin.assets.list:
    default: op
  spectraevents.admin.assets.validate:
    default: op

  spectraevents.admin.model:
    description: "Grants access to Paper model-inspection commands."
    default: op
    children:
      spectraevents.admin.model.info: true
      spectraevents.admin.model.list: true
  spectraevents.admin.model.info:
    default: op
  spectraevents.admin.model.list:
    default: op
