schema-version: "1"
id: vault_example
initial-phase: locked

phases:
  locked:
    on-enter:
      - type: set_locked
        duration: 10s
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 10s
        target: open
  open:
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: give_item
            material: minecraft:gold_ingot
            amount: 4
        target: claimed
  claimed:
    on-enter:
      - type: complete_event
