schema-version: "1"
id: airdrop_example
initial-phase: descending

phases:
  descending:
    on-enter:
      - type: broadcast_message
        message: "<yellow>An airdrop is descending.</yellow>"
      - type: spawn_model
        model: dev_airdrop_model
        height-offset: 15
      - type: play_animation
        model: dev_airdrop_model
        animation: descent
        loop: ONCE
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 5s
        target: open
  open:
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: give_item
            material: minecraft:diamond
            amount: 1
        target: claimed
  claimed:
    on-enter:
      - type: remove_model
      - type: complete_event
