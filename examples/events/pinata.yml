schema-version: "1"
id: pinata_example
initial-phase: active

phases:
  active:
    on-enter:
      - type: initialize_hit_counter
        max: 20
      - type: spawn_model
        model: pinata
      - type: play_animation
        model: pinata
        animation: sway
        loop: LOOP
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: increment_hits
      - trigger:
          type: hits_reached
        target: broken
  broken:
    on-enter:
      - type: drop_loot
        radius: 2
        items:
          - material: minecraft:cookie
            amount: 8
            chance: 100
      - type: remove_model
      - type: complete_event
