schema-version: "1"
id: pinata_example
initial-phase: active

phases:
  active:
    on-enter:
      - type: initialize_health
        max: 20
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: apply_damage
            amount: 1
      - trigger:
          type: health_depleted
        target: broken
  broken:
    on-enter:
      - type: drop_loot
        radius: 2
        items:
          - material: minecraft:cookie
            amount: 8
            chance: 100
      - type: complete_event
