schema-version: "1"
id: boss_portal_example
initial-phase: opening

phases:
  opening:
    on-enter:
      - type: broadcast_message
        message: "<dark_purple>A boss portal is opening.</dark_purple>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 5s
        target: active
  active:
    transitions:
      - trigger:
          type: entity_death
        target: defeated
  defeated:
    on-enter:
      - type: broadcast_message
        message: "<green>The portal guardian was defeated.</green>"
      - type: complete_event
