schema-version: "1"
id: metin_example
initial-phase: active

phases:
  active:
    on-enter:
      - type: initialize_health
        max: 100
      - type: spawn_model
        model: dev_metin_model
      - type: play_animation
        model: dev_metin_model
        animation: pulse
        loop: LOOP
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: apply_damage
            amount: 10
      - trigger:
          type: health_depleted
        target: defeated
  defeated:
    on-enter:
      - type: drop_loot
        radius: 2
        items:
          - material: minecraft:diamond
            amount: 1
            chance: 100
      - type: remove_model
      - type: complete_event
