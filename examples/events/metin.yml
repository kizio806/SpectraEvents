schema-version: "1"
id: metin_example
initial-phase: active

phases:
  active:
    on-enter:
      - type: initialize_health
        max: 100
    transitions:
      - trigger:
          type: interaction
        actions:
          - type: apply_damage
            amount: 10
      - trigger:
          type: health_depleted
        target: defeated
  defeated:
    on-enter:
      - type: drop_loot
        radius: 2
        items:
          - material: minecraft:diamond
            amount: 1
            chance: 100
      - type: complete_event
