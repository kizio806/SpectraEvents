schema-version: "1"
id: meteor_example
initial-phase: falling

phases:
  falling:
    on-enter:
      - type: broadcast_message
        message: "<gold>A meteor is falling.</gold>"
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 3s
        target: impact
  impact:
    on-enter:
      - type: play_sound
        sound: minecraft:entity.generic.explode
      - type: spawn_particles
        particle: minecraft:explosion
        count: 10
    transitions:
      - trigger:
          type: manual
        target: completed
  completed:
    on-enter:
      - type: complete_event
