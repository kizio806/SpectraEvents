schema-version: "1"
id: meteor_example
initial-phase: falling

phases:
  falling:
    on-enter:
      - type: broadcast_message
        message: "<gold>A meteor is falling.</gold>"
      - type: spawn_model
        model: meteor_core
        height-offset: 20
      - type: play_animation
        model: meteor_core
        animation: fall
        loop: ONCE
    transitions:
      - trigger:
          type: timer_elapsed
          duration: 3s
        target: impact
  impact:
    on-enter:
      - type: play_sound
        sound: minecraft:entity.generic.explode
      - type: spawn_particles
        particle: minecraft:explosion
        count: 10
    transitions:
      - trigger:
          type: manual
        target: completed
  completed:
    on-enter:
      - type: remove_model
      - type: complete_event
