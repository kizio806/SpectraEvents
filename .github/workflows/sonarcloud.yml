name: "SonarCloud Analysis"

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Run Tests, JaCoCo, and SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            # Ensure SonarCloud's default branch matches GitHub's 'main' branch
            curl -s -X POST 'https://sonarcloud.io/api/project_branches/rename' \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              -d "project=kizio806_SpectraEvents" \
              -d "name=main" || true

            ./gradlew --no-daemon clean check jacocoRootReport sonar -Dsonar.qualitygate.wait=true
          else
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
              echo "::notice ::SONAR_TOKEN is unavailable for fork PR. Running clean check and JaCoCo coverage reports locally."
              ./gradlew --no-daemon clean check jacocoRootReport
            else
              echo "::error ::SONAR_TOKEN is required for repository branches and internal pull requests."
              exit 1
            fi
          fi
