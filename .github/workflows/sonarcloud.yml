name: "SonarCloud Analysis"

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Configure SonarCloud Project Settings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "Ensuring Automatic Analysis is disabled for CI analysis..."
            curl -s -u "${SONAR_TOKEN}:" -X POST "https://sonarcloud.io/api/autoscan/activation" \
              -d "projectKey=kizio806_SpectraEvents" \
              -d "enable=false" || true

            BRANCHES=$(curl -s -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/project_branches/list?project=kizio806_SpectraEvents" || true)
            if echo "$BRANCHES" | grep -q '"name":"master","isMain":true'; then
              echo "SonarCloud main branch is configured as 'master'. Switching to 'main'..."
              curl -s -u "${SONAR_TOKEN}:" -X POST "https://sonarcloud.io/api/project_branches/delete?project=kizio806_SpectraEvents&branch=main" || true
              curl -s -u "${SONAR_TOKEN}:" -X POST "https://sonarcloud.io/api/project_branches/rename?project=kizio806_SpectraEvents&name=main" || true
            fi
          fi

      - name: Run Tests, JaCoCo, and SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            ./gradlew --no-daemon clean check jacocoRootReport sonar \
              -Dsonar.coverage.exclusions="**/distributions/**,**/distributions/**/*,distributions/**,distributions/**/*,**/build-logic/**,build-logic/**" \
              -Dsonar.cpd.exclusions="**/distributions/**,**/distributions/**/*,distributions/**,distributions/**/*,**/build-logic/**,build-logic/**"
          else
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
              echo "::notice ::SONAR_TOKEN is unavailable for fork PR. Running clean check and JaCoCo coverage reports locally."
              ./gradlew --no-daemon clean check jacocoRootReport
            else
              echo "::error ::SONAR_TOKEN is required for repository branches and internal pull requests."
              exit 1
            fi
          fi
