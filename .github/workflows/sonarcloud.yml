name: "SonarCloud Analysis"

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Disable SonarCloud Automatic Analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s -u "${SONAR_TOKEN}:" -X POST "https://sonarcloud.io/api/autoscan/activation" \
            -d "projectKey=kizio806_SpectraEvents" \
            -d "enable=false" || true

      - name: Run Tests, JaCoCo, and SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            ./gradlew --no-daemon clean check jacocoRootReport sonar
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::notice ::SONAR_TOKEN is unavailable for this pull request. Running clean check and JaCoCo coverage reports locally."
            ./gradlew --no-daemon clean check jacocoRootReport
          else
            echo "::error ::SONAR_TOKEN is required for repository branches and internal pushes."
            exit 1
          fi
