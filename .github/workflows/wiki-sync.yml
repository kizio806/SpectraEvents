name: "Wiki Sync"

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    name: Sync wiki/ to GitHub Wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate wiki source files
        run: |
          test -d wiki || { echo "::error::Missing wiki directory"; exit 1; }
          test -f wiki/Home.md || { echo "::error::Missing wiki/Home.md"; exit 1; }
          test -f wiki/_Sidebar.md || { echo "::error::Missing wiki/_Sidebar.md"; exit 1; }
          echo "Wiki source files validated successfully."

      - name: Clone wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo || {
            echo "::warning::Failed to clone ${GITHUB_REPOSITORY}.wiki.git."
            echo "Ensure GitHub Wiki is enabled in repository settings and at least one initial page exists."
            exit 0
          }

      - name: Sync wiki content
        run: |
          if [ -d wiki-repo ]; then
            rsync -av --delete --exclude='.git' wiki/ wiki-repo/
          fi

      - name: Commit and push changes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ ! -d wiki-repo ]; then
            echo "Wiki repo not cloned; skipping commit."
            exit 0
          fi
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
            exit 0
          fi

          git commit -m "docs: sync wiki from ${GITHUB_SHA::7}"
          git push origin HEAD:master
