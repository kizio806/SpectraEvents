name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '25'

jobs:
  build:
    name: Release / Build and Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      modrinth_type: ${{ steps.metadata.outputs.modrinth_type }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^spectraevents.version=//p' gradle.properties | tr -d ' \r\n')"
          test -n "$VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
              echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${VERSION}"
              exit 1
            }
            test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag || {
              echo "::error::Release tags must be annotated and signed, not lightweight"
              exit 1
            }
            TAG_SHA="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")"
            VERIFIED="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.verification.verified')"
            test "$VERIFIED" = true || {
              echo "::error::GitHub did not verify the signed tag ${GITHUB_REF_NAME}"
              exit 1
            }
          fi
          if [[ "$VERSION" == *-alpha* ]]; then
            TYPE=alpha
            PRERELEASE=true
          elif [[ "$VERSION" == *-beta* || "$VERSION" == *-rc* ]]; then
            TYPE=beta
            PRERELEASE=true
          else
            TYPE=release
            PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "modrinth_type=$TYPE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Execute complete quality gate and build exactly two distributions
        run: ./gradlew --no-daemon --stacktrace clean check build

      - name: Scan locked dependencies for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --recursive
            .

      - name: Stage and checksum artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.metadata.outputs.version }}"
          mkdir release-artifacts
          cp "distributions/paper/build/libs/SpectraEvents-${VERSION}-paper.jar" release-artifacts/
          cp "distributions/spigot/build/libs/SpectraEvents-${VERSION}-spigot.jar" release-artifacts/
          test "$(find release-artifacts -maxdepth 1 -name 'SpectraEvents-*.jar' | wc -l)" -eq 2
          (cd release-artifacts && sha256sum SpectraEvents-*.jar > SHA256SUMS.txt)
          (cd release-artifacts && sha256sum -c SHA256SUMS.txt)

      - name: Upload verified release inputs
        uses: actions/upload-artifact@v7
        with:
          name: release-inputs
          path: release-artifacts/
          if-no-files-found: error

  runtime-matrix:
    name: Release / Runtime (${{ matrix.server }} ${{ matrix.version }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: paper, family: paper, version: '26.1' }
          - { server: paper, family: paper, version: '26.2' }
          - { server: paper, family: paper, version: '26.3' }
          - { server: purpur, family: paper, version: '26.1' }
          - { server: purpur, family: paper, version: '26.2' }
          - { server: purpur, family: paper, version: '26.3' }
          - { server: folia, family: paper, version: '26.1' }
          - { server: folia, family: paper, version: '26.2' }
          - { server: folia, family: paper, version: '26.3' }
          - { server: spigot, family: spigot, version: '26.1' }
          - { server: spigot, family: spigot, version: '26.2' }
          - { server: spigot, family: spigot, version: '26.3' }
          - { server: craftbukkit, family: spigot, version: '26.1' }
          - { server: craftbukkit, family: spigot, version: '26.2' }
          - { server: craftbukkit, family: spigot, version: '26.3' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: release-inputs
          path: release-artifacts
      - name: Cache real server binary
        uses: actions/cache@v6
        with:
          path: .gradle/runtime-server-cache
          key: runtime-${{ matrix.server }}-${{ matrix.version }}-java25
      - name: Exercise lifecycle, cleanup, and restart recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runtime-smoke/runtime_workflow.py \
            --server "${{ matrix.server }}" \
            --version "${{ matrix.version }}" \
            --artifact release-artifacts/SpectraEvents-*-${{ matrix.family }}.jar

  publish:
    name: Release / Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, runtime-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-inputs
          path: release-artifacts

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          {
            echo "# SpectraEvents v${VERSION}"
            echo
            echo "Two platform-specific artifacts; do not mix them:"
            echo
            echo "- Paper/Purpur/Folia 26.1-26.3: SpectraEvents-${VERSION}-paper.jar"
            echo "- Spigot/CraftBukkit 26.1-26.3: SpectraEvents-${VERSION}-spigot.jar"
            echo
            echo "All declared real-server lifecycle, cleanup, and restart-recovery jobs passed before publication."
            echo
            if [[ -f CHANGELOG.md ]]; then
              awk -v version="$VERSION" '$0 ~ "^## \\[" version "\\]" {show=1; next} /^## \\[/ {show=0} show' CHANGELOG.md
            else
              git log -n 10 --oneline
            fi
          } > release-notes.md

      - name: Publish Paper family version to Modrinth
        id: modrinth_paper
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: SpectraEvents ${{ needs.build.outputs.version }} — Paper family
          version: ${{ needs.build.outputs.version }}-paper
          version-type: ${{ needs.build.outputs.modrinth_type }}
          game-versions: |
            26.1
            26.2
            26.3
          loaders: |
            paper
            purpur
            folia
          java: 25
          environment: server
          files: release-artifacts/SpectraEvents-*-paper.jar
          changelog-file: release-notes.md

      - name: Publish Spigot family version to Modrinth
        id: modrinth_spigot
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: SpectraEvents ${{ needs.build.outputs.version }} — Spigot/Bukkit
          version: ${{ needs.build.outputs.version }}-spigot
          version-type: ${{ needs.build.outputs.modrinth_type }}
          game-versions: |
            26.1
            26.2
            26.3
          loaders: |
            spigot
            bukkit
          java: 25
          environment: server
          files: release-artifacts/SpectraEvents-*-spigot.jar
          changelog-file: release-notes.md

      - name: Refuse a partial release
        if: steps.modrinth_paper.outcome != 'success' || steps.modrinth_spigot.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Modrinth publication is partial or failed. Paper=${{ steps.modrinth_paper.outcome }}, Spigot=${{ steps.modrinth_spigot.outcome }}. GitHub Release was not created; inspect Modrinth and reconcile manually."
          exit 1

      - name: Create GitHub Release after both Modrinth versions exist
        id: github_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SpectraEvents v${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: |
            release-artifacts/SpectraEvents-*.jar
            release-artifacts/SHA256SUMS.txt
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.prerelease == 'false' }}

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "# SpectraEvents Release"
            echo "- Version: ${{ needs.build.outputs.version }}"
            echo "- Runtime matrix: passed"
            echo "- Modrinth Paper: ${{ steps.modrinth_paper.outcome }}"
            echo "- Modrinth Spigot: ${{ steps.modrinth_spigot.outcome }}"
            echo "- GitHub Release: ${{ steps.github_release.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
