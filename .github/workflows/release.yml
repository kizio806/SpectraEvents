name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '25'

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read project metadata
        id: metadata
        run: |
          VERSION=$(grep '^spectraevents.version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          GROUP=$(grep '^spectraevents.group=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "GRADLE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "GRADLE_GROUP=$GROUP" >> $GITHUB_ENV
          echo "Read version '$VERSION' and group '$GROUP' from gradle.properties."

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            echo "::error::Tag name '$TAG_NAME' must start with 'v'!"
            exit 1
          fi
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match Gradle project version '$GRADLE_VERSION'!"
            exit 1
          fi
          echo "Tag version '$TAG_VERSION' successfully validated against Gradle version '$GRADLE_VERSION'."

      - name: Determine release type
        run: |
          if [[ "$GRADLE_VERSION" == *"-alpha"* ]]; then
            echo "RELEASE_TYPE=alpha" >> $GITHUB_ENV
            echo "MODRINTH_TYPE=alpha" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          elif [[ "$GRADLE_VERSION" == *"-beta"* ]] || [[ "$GRADLE_VERSION" == *"-rc"* ]]; then
            echo "RELEASE_TYPE=beta" >> $GITHUB_ENV
            echo "MODRINTH_TYPE=beta" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "RELEASE_TYPE=release" >> $GITHUB_ENV
            echo "MODRINTH_TYPE=release" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Execute full quality gate & build
        run: ./gradlew --no-daemon --stacktrace clean check build

      - name: Discover and verify final distribution artifact
        id: artifact
        run: |
          LIBS_DIR="distributions/paper/v26_2/build/libs"
          JARS=($(find "$LIBS_DIR" -name "SpectraEvents-*.jar" ! -name "*-sources.jar"))
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "::error::No distribution JAR found in $LIBS_DIR!"
            exit 1
          fi
          if [ ${#JARS[@]} -gt 1 ]; then
            echo "::error::Multiple distribution JARs found in $LIBS_DIR: ${JARS[*]}"
            exit 1
          fi
          JAR_PATH="${JARS[0]}"
          JAR_NAME=$(basename "$JAR_PATH")
          echo "FINAL_JAR_PATH=$JAR_PATH" >> $GITHUB_ENV
          echo "FINAL_JAR_NAME=$JAR_NAME" >> $GITHUB_ENV
          echo "Verified single distribution artifact: $JAR_NAME ($JAR_PATH)"

          echo "Inspecting artifact structure..."
          jar tf "$JAR_PATH" | grep "plugin.yml"
          jar tf "$JAR_PATH" | grep "io/github/kizio806/spectraevents/platform/paper/v26_2/SpectraEventsPlugin.class"

          OLD_CLASSES=$(jar tf "$JAR_PATH" | grep "dev/spectraevents" || true)
          if [ -n "$OLD_CLASSES" ]; then
            echo "::error::JAR contains legacy dev/spectraevents classes!"
            exit 1
          fi

      - name: Generate Release Notes
        run: |
          cat << EOF > release-notes.md
          # SpectraEvents v${GRADLE_VERSION}

          - **Minecraft Version:** 26.2
          - **Platform:** Paper
          - **Java Runtime:** 25

          EOF

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "> **Notice:** This is a pre-release version for testing." >> release-notes.md
            echo "" >> release-notes.md
          fi

          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SECTION=$(awk -v ver="${GRADLE_VERSION}" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              $0 ~ "^## \\[" { flag=0 }
              flag { print }
            ' CHANGELOG.md)

            if [ -n "$CHANGELOG_SECTION" ]; then
              echo "$CHANGELOG_SECTION" >> release-notes.md
            else
              echo "### Changes" >> release-notes.md
              git log -n 10 --oneline >> release-notes.md
            fi
          else
            echo "### Changes" >> release-notes.md
            git log -n 10 --oneline >> release-notes.md
          fi

      - name: Compute SHA-256 checksum
        run: |
          cd distributions/paper/v26_2/build/libs/
          sha256sum "$FINAL_JAR_NAME" > "${FINAL_JAR_NAME}.sha256"
          sha256sum -c "${FINAL_JAR_NAME}.sha256"
          CHECKSUM=$(cat "${FINAL_JAR_NAME}.sha256" | awk '{print $1}')
          echo "SHA256_CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "SHA-256 Checksum: $CHECKSUM"

      - name: Upload Release Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: spectraevents-release-artifacts
          path: |
            ${{ env.FINAL_JAR_PATH }}
            ${{ env.FINAL_JAR_PATH }}.sha256
            release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SpectraEvents v${{ env.GRADLE_VERSION }}
          body_path: release-notes.md
          files: |
            ${{ env.FINAL_JAR_PATH }}
            ${{ env.FINAL_JAR_PATH }}.sha256
          prerelease: false
          make_latest: true

      - name: Validate Modrinth Credentials
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          MODRINTH_ID: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_ID" ]; then
            echo "::warning::MODRINTH_PROJECT_ID secret or variable is missing!"
          fi
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::warning::MODRINTH_TOKEN secret is missing!"
          fi
          echo "Modrinth credentials checked."

      - name: Publish to Modrinth
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: SpectraEvents ${{ env.GRADLE_VERSION }}
          version: ${{ env.GRADLE_VERSION }}
          version-type: ${{ env.MODRINTH_TYPE }}
          game-versions: "1.21.4"
          loaders: |
            paper
            purpur
            folia
          java: 25
          environment: server
          files: ${{ env.FINAL_JAR_PATH }}
          changelog-file: release-notes.md

      - name: Generate Release Summary
        if: always()
        run: |
          echo "# SpectraEvents Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ env.GRADLE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Type** | \`${{ env.RELEASE_TYPE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Minecraft** | \`26.2\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | \`Paper / Purpur / Folia\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`${{ env.FINAL_JAR_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256** | \`${{ env.SHA256_CHECKSUM }}\` |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "| **GitHub Release** | Published |" >> $GITHUB_STEP_SUMMARY
            echo "| **Modrinth** | Published |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **GitHub Release** | Skipped (Not a tag build) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Modrinth** | Skipped (Not a tag build) |" >> $GITHUB_STEP_SUMMARY
          fi
