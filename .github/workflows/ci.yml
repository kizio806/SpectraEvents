name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  lint-and-structure:
    name: CI / Lint & Structure
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Run code formatting & boundary checks
        run: ./gradlew spotlessCheck verifyPlatformBoundaries

  core-tests:
    name: CI / Core Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Core unit & architecture tests
        run: ./gradlew :spectraevents-core:check

  application-tests:
    name: CI / Application Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Application tests & integration suite
        run: ./gradlew :spectraevents-application:check

      - name: Upload Application test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-application
          path: spectraevents-application/build/reports/tests/

  adapter-tests:
    name: CI / Adapter Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Adapter tests
        run: ./gradlew :adapters:storage-sqlite:check :adapters:update-http:check

      - name: Upload Adapter test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-adapters
          path: adapters/*/build/reports/tests/

  platform-build-and-tests:
    name: CI / Platform Build & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [paper, spigot, sponge]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Platform checks
        run: ./gradlew :platforms:${{ matrix.platform }}:common:check

  distribution-verification:
    name: CI / Distribution Verification
    needs:
      - lint-and-structure
      - core-tests
      - application-tests
      - adapter-tests
      - platform-build-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [paper, spigot, sponge]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build distribution artifact
        run: ./gradlew :distributions:${{ matrix.platform }}:build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: spectraevents-${{ matrix.platform }}
          path: distributions/${{ matrix.platform }}/build/libs/SpectraEvents-*.jar
          if-no-files-found: error

  runtime-smoke:
    name: CI / Runtime Smoke Matrix (${{ matrix.platform }} ${{ matrix.version }})
    needs:
      - distribution-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: paper
            version: '26.1.1'
          - platform: paper
            version: '26.1.2'
          - platform: paper
            version: '26.2'
          - platform: paper
            version: '26.3'
          - platform: spigot
            version: '26.1.1'
          - platform: spigot
            version: '26.1.2'
          - platform: spigot
            version: '26.2'
          - platform: spigot
            version: '26.3'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build distribution JARs
        run: ./gradlew :distributions:${{ matrix.platform }}:build

      - name: Make scripts executable
        run: chmod +x scripts/runtime-smoke/*.sh

      - name: Run Smoke Test
        run: ./scripts/runtime-smoke/run-${{ matrix.platform }}-smoke.sh "${{ matrix.version }}"

  release-readiness:
    name: CI / Release Readiness
    needs:
      - distribution-verification
      - runtime-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run root quality gate
        run: ./gradlew --no-daemon clean check build

      - name: Generate CI Summary
        run: |
          echo "# SpectraEvents CI Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gate:** PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Distribution Verification:** PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Java:** ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
