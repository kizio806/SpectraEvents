name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  lint-and-structure:
    name: CI / Lint & Structure
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Run code formatting & boundary checks
        run: ./gradlew spotlessCheck verifyPlatformBoundaries

  core-tests:
    name: CI / Core Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Core unit & architecture tests
        run: ./gradlew :spectraevents-core:check

  application-tests:
    name: CI / Application Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Application tests & integration suite
        run: ./gradlew :spectraevents-application:check

      - name: Upload Application test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-application
          path: spectraevents-application/build/reports/tests/

  adapter-tests:
    name: CI / Adapter Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Adapter tests
        run: ./gradlew :adapters:storage-sqlite:check :adapters:update-http:check

      - name: Upload Adapter test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-adapters
          path: adapters/*/build/reports/tests/

  paper-build-and-tests:
    name: CI / Paper Build & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Paper platform checks
        run: ./gradlew :platforms:paper:common:check :platforms:paper:v26_2:check

  distribution-verification:
    name: CI / Distribution Verification
    needs:
      - lint-and-structure
      - core-tests
      - application-tests
      - adapter-tests
      - paper-build-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build distribution artifact
        run: ./gradlew :distributions:paper:v26_2:build

      - name: Inspect generated JAR
        run: |
          JAR_FILE=$(find distributions/paper/v26_2/build/libs/ -name "SpectraEvents-*.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::Distribution JAR file not found!"
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          jar tf "$JAR_FILE" | grep "plugin.yml"
          jar tf "$JAR_FILE" | grep "io/github/kizio806/spectraevents/platform/paper/v26_2/SpectraEventsPlugin.class"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: spectraevents-paper
          path: distributions/paper/v26_2/build/libs/SpectraEvents-*.jar
          if-no-files-found: error

  release-readiness:
    name: CI / Release Readiness
    needs:
      - distribution-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run root quality gate
        run: ./gradlew --no-daemon clean check build

      - name: Generate CI Summary
        run: |
          echo "# SpectraEvents CI Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gate:** PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Distribution Verification:** PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Java:** ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
