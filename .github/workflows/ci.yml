name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  lint-and-structure:
    name: CI / Lint & Structure
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Run formatting, static analysis, and boundary checks
        run: ./gradlew --no-daemon spotlessCheck checkstyleMain pmdMain spotbugsMain verifyPlatformBoundaries validateStructure validateSourceHygiene

      - name: Validate documented release blockers
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -m unittest discover -s scripts/runtime-smoke -p 'test_*.py'
          python3 scripts/release/verify_release_gate.py --runtime-matrix-status failure --allow-blocked

  core-tests:
    name: CI / Core Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Core unit & architecture tests
        run: ./gradlew :spectraevents-core:check

  application-tests:
    name: CI / Application Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Application tests & integration suite
        run: ./gradlew :spectraevents-application:check

      - name: Upload Application test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-application
          path: spectraevents-application/build/reports/tests/

  adapter-tests:
    name: CI / Adapter Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Adapter tests
        run: ./gradlew :adapters:storage-sqlite:check :adapters:update-http:check :adapters:assets-blockbench:check :adapters:assets-delivery:check

      - name: Upload Adapter test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-adapters
          path: adapters/*/build/reports/tests/

  platform-build-and-tests:
    name: CI / Platform Build & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [paper, spigot]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Platform checks
        run: ./gradlew :platforms:${{ matrix.platform }}:common:check

  distribution-verification:
    name: CI / Distribution Verification
    needs:
      - lint-and-structure
      - core-tests
      - application-tests
      - adapter-tests
      - platform-build-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        platform: [paper, spigot]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build distribution artifact
        run: ./gradlew :distributions:${{ matrix.platform }}:build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spectraevents-${{ matrix.platform }}
          path: distributions/${{ matrix.platform }}/build/libs/SpectraEvents-*.jar
          if-no-files-found: error

  runtime-smoke:
    name: CI / Runtime Workflow (${{ matrix.server }} ${{ matrix.version }})
    needs:
      - distribution-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: paper, family: paper, version: '26.1' }
          - { server: paper, family: paper, version: '26.2' }
          - { server: paper, family: paper, version: '26.3' }
          - { server: purpur, family: paper, version: '26.1' }
          - { server: purpur, family: paper, version: '26.2' }
          - { server: purpur, family: paper, version: '26.3' }
          - { server: folia, family: paper, version: '26.1' }
          - { server: folia, family: paper, version: '26.2' }
          - { server: spigot, family: spigot, version: '26.1' }
          - { server: spigot, family: spigot, version: '26.2' }
          - { server: spigot, family: spigot, version: '26.3' }
          - { server: craftbukkit, family: spigot, version: '26.1' }
          - { server: craftbukkit, family: spigot, version: '26.2' }
          - { server: craftbukkit, family: spigot, version: '26.3' }
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build distribution JARs
        run: ./gradlew :distributions:${{ matrix.family }}:build

      - name: Cache runtime server binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gradle/runtime-server-cache
          key: runtime-${{ matrix.server }}-${{ matrix.version }}-java25

      - name: Run lifecycle, cleanup, and restart workflow
        run: |
          python3 scripts/runtime-smoke/runtime_workflow.py \
            --server "${{ matrix.server }}" \
            --version "${{ matrix.version }}" \
            --artifact distributions/${{ matrix.family }}/build/libs/SpectraEvents-*-"${{ matrix.family }}".jar

  release-readiness:
    name: CI / Release Readiness
    needs:
      - distribution-verification
      - runtime-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run root quality gate
        run: ./gradlew --no-daemon clean check build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

      - name: Scan locked dependencies for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            .

      - name: Generate CI Summary
        run: |
          {
            echo "# SpectraEvents CI Status"
            echo "- **Quality Gate:** PASS"
            echo "- **Distribution Verification:** PASS"
            echo "- **Target Java:** ${{ env.JAVA_VERSION }}"
          } >> "$GITHUB_STEP_SUMMARY"
