name: "Bug Report"
description: "Report a bug or unexpected behavior in SpectraEvents."
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please fill in all required fields so we can investigate accurately.

  - type: dropdown
    id: platform
    attributes:
      label: "Server Platform"
      options:
        - "Paper"
        - "Purpur"
        - "Folia (26.1–26.2 only)"
        - "Spigot"
        - "CraftBukkit"
    validations:
      required: true

  - type: dropdown
    id: mc_version
    attributes:
      label: "Minecraft Version"
      options:
        - "26.3"
        - "26.2"
        - "26.1"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: "SpectraEvents Version"
      placeholder: "e.g. 0.1.1-beta.2"
    validations:
      required: true

  - type: input
    id: java_version
    attributes:
      label: "Java Version"
      placeholder: "e.g. Java 25 (OpenJDK 25.0.2)"
    validations:
      required: true

  - type: textarea
    id: installed_plugins
    attributes:
      label: "Installed Plugins & Integrations"
      description: "List relevant plugins (e.g., LuckPerms, Vault, WorldGuard, Nexo, ItemsAdder, Oraxen)."
      placeholder: "e.g. LuckPerms 5.4, Vault 1.7, WorldGuard 7.0.9"

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Start server with event definition X
        2. Execute /spectraevents event start X
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: server_logs
    attributes:
      label: "Server Logs & /spectraevents doctor Output"
      description: "Paste relevant stack traces or console output. Sanitize any private player data."
      render: text
