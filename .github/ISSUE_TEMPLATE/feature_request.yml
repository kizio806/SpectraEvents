name: "Feature Request"
description: "Suggest an action, trigger, condition, or engine enhancement for SpectraEvents."
title: "[Feature] "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a reusable event action, condition, trigger, or engine capability? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case"
      description: "What problem does this solve or what event mechanic does it enable?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe how you envision this working in YAML event definitions or commands."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative approaches or existing plugins you have evaluated."
