version: 2
# Dependabot maintains GitHub Actions workflows and actions.
# Gradle dependencies, plugins, catalogs, and wrapper updates are managed by Renovate.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
